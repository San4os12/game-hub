/* ================= Полировка дизайна ================= */
:root{--gap:12px}
body{-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}
/* липкая верхняя панель с названием раздела */
.top{position:sticky;top:0;z-index:15;margin:-12px -14px 12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;gap:8px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
body.scrolled .top{border-bottom-color:var(--line)}
:root{padding-top:0}
#cur{flex:1;min-width:0;margin:0;font-size:min(22px,calc(var(--hs) - 2px));line-height:1.15;gap:8px}
#cur span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cur svg.i{flex:none}
.top .live{flex:none;padding:5px 9px}
.top .live [data-i=online]{display:none}
#cur svg.i{width:20px;height:20px}
.top .live{order:0}
.mebtn{margin:0 0 0 2px;width:40px;height:40px}
/* нижняя панель вкладок (телефон) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;padding:6px 2px 4px;
  background:transparent!important;color:var(--muted)!important;border:0!important;box-shadow:none!important;clip-path:none!important;font:700 11px var(--fb)!important;text-transform:none!important;letter-spacing:0!important}
.tab .tic{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .2s}
.tab .tic svg.i{width:22px;height:22px}
.tab .tic .pav{width:26px;height:26px;font-size:15px;border:2px solid transparent}
.tab.on{color:var(--ink)!important}
.tab.on .tic{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.tab.on .tic .pav{border-color:var(--accent)}
.tab .tlb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .bdg{position:absolute;top:2px;left:calc(50% + 8px);margin:0;min-width:18px;text-align:center;padding:1px 5px;font-size:11px}
.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.chatopen .tabbar,body.sheet .tabbar{display:none}
.onb:not([hidden])~.tabbar{display:none}
/* меню: группы вместо одного длинного списка */
.mg{font:700 13px var(--fb);color:var(--muted);margin:18px 6px 8px;text-transform:none;letter-spacing:0}
.mg:first-child{margin-top:6px}
.ds[data-i=m_sec]{display:none}
.ds{text-transform:none;letter-spacing:.2px;font-size:13px}
/* карточки и списки */
.box{padding:16px;margin-bottom:var(--gap)}
.box>b:first-child{font-size:17px}
.item{min-height:56px}
.item.click:not(:has(button))::after{content:'';flex:none;width:8px;height:8px;margin:0 4px 0 2px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);opacity:.7}
.item.click .bdg{margin-left:auto}
/* отклик на нажатие и фокус */
button{transition:filter .15s,transform .08s,background-color .15s}
button:active:not(:disabled){transform:translateY(1px) scale(.985)}
button:disabled{cursor:default}
:is(button,input,select,textarea,.item.click):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
/* переход между разделами в ответ на нажатие */
.sec.on{animation:secIn .18s ease-out}
@keyframes secIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* уведомление ниже панели */
.toast{top:auto;bottom:calc(88px + env(safe-area-inset-bottom,0px));font-size:15px;line-height:1.35;padding:12px 18px;border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);transform:translate(-50%,calc(100% + 140px));transition:transform .3s cubic-bezier(.2,1.2,.4,1)}
.toast.on{transform:translate(-50%,0)}
body.chatopen .toast,body.sheet .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.rw.on~.toast.on,.toast.on:has(~.rw.on){bottom:calc(200px + env(safe-area-inset-bottom,0px))}
/* читаемость в светлых стилях */

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:1024px){
  .tabbar{display:none}
  .wrap{padding-bottom:48px}
  .top{margin:-18px -32px 18px;padding:14px 32px}
  #cur{font-size:min(30px,calc(var(--hs) + 2px))}
  #cur svg.i{width:24px;height:24px}
  .mebtn{width:44px;height:44px}
  .toast{top:auto;bottom:28px}
  .top .live [data-i=online]{display:inline}
}
/* ===== Карточка награды XP ===== */
.rw{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:61;width:min(92vw,420px);
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;cursor:pointer;
  background:var(--card);background:color-mix(in srgb,var(--bg) 70%,var(--accent) 30%);border:2px solid var(--accent);
  box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transform:translate(-50%,calc(100% + 120px));opacity:0;transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .2s;pointer-events:none}
.rw.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.rwi{flex:none;width:56px;height:56px;display:grid;place-items:center;font-size:32px;border-radius:16px;background:rgba(0,0,0,.25)}
.rwb{flex:1;min-width:0}
.rwn{font:900 30px/1 var(--fh);color:var(--warn);letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.rwt{font-weight:800;font-size:15px;margin-top:4px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rws{font-size:12px;color:var(--muted)}
.rwbar{height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:8px}
.rwbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--warn));transition:width .9s cubic-bezier(.3,.8,.3,1)}
.rwl{font-size:12px;color:var(--muted);margin-top:4px}
.rw.lvl{border-color:var(--warn);box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 6px color-mix(in srgb,var(--warn) 30%,transparent),0 0 40px color-mix(in srgb,var(--warn) 45%,transparent)}
.rw.lvl .rwi{animation:rwPop .6s ease-out 2}
@keyframes rwPop{50%{transform:scale(1.25) rotate(-6deg)}}
body.chatopen .rw,body.sheet .rw{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:1024px){.rw{left:auto;right:28px;bottom:28px;transform:translate(0,calc(100% + 60px))}.rw.on{transform:none}}
/* ===== Правила ===== */
.rulc{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;line-height:1.4;cursor:pointer}
.rulc input{margin-top:1px}
.rulc a{color:var(--accent)}
/* ===== Баннеры профиля ===== */
.pcard{position:relative;margin:-16px -16px 12px;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.sh .pcard{margin:-4px 0 12px;border-radius:16px}
.pban{height:96px;background:var(--accent)}
.pcard .ph{position:relative;margin:-36px 16px 0;align-items:flex-end}
.pcard .ph .pav{width:76px;height:76px;font-size:40px;border:4px solid var(--card);background:var(--card)}
.pcard .ph>div:last-child{padding-bottom:4px;min-width:0}
.pcard .ph b{text-shadow:0 1px 0 rgba(0,0,0,.25)}
.bng{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bng button{position:relative;height:56px;padding:0;border-radius:12px!important;border:3px solid transparent!important;box-shadow:none!important;clip-path:none!important;overflow:hidden}
.bng button.on{border-color:var(--ink)!important}
.bng button .lk,.frg button .lk{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font:800 12px var(--fb)}
.frg{display:flex;flex-wrap:wrap;gap:10px}
.frg button{position:relative;width:62px;height:62px;padding:0;border-radius:50%!important;background:transparent!important;border:2px solid transparent!important;box-shadow:none!important;clip-path:none!important;overflow:visible}

.frg button .pav{width:100%;height:100%}
.frg button .lk{border-radius:50%}
/* рамки аватарок */
.pav.fr1{box-shadow:0 0 0 3px #cd7f32,0 0 0 5px rgba(0,0,0,.35)}
.pav.fr2{box-shadow:0 0 0 3px #c0c0c0,0 0 10px #c0c0c0}
.pav.fr3{box-shadow:0 0 0 3px #f5c542,0 0 14px #f5c542}
.pav.fr4{box-shadow:0 0 0 3px #7ff3ff,0 0 0 6px #b77bff,0 0 18px #7ff3ff}

.pav.fr6{box-shadow:0 0 0 3px #39ff14,0 0 14px #39ff14}
/* жалобы, баны, модерация */
.banbar{margin:0 12px 8px;padding:10px 12px;border-radius:12px;background:#7a1f1f;color:#fff;font-size:13px;font-weight:700}
.rsn{display:grid;gap:8px;margin-top:10px}
.rsn button{text-align:left;justify-content:flex-start}
.mdi{padding:12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:rgba(0,0,0,.18)}

.danger2{background:#c0392b!important;color:#fff!important}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}

.lbtabs3{grid-template-columns:repeat(4,minmax(0,1fr))!important}.lbtabs3 button{padding-left:6px;padding-right:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uid{font:600 12px ui-monospace,monospace;word-break:break-all;color:var(--muted);margin-top:6px}

.grid>.mg{grid-column:1/-1;margin:10px 4px 2px}
/* ===== Новый профиль ===== */
#mehead{margin-bottom:14px}
.pro{position:relative;background:var(--card);border:1px solid var(--line);border-radius:max(var(--r),4px);overflow:hidden}
.pro-ban{position:relative;height:clamp(130px,24vw,230px);background-size:cover!important;background-position:center!important}

.pro-eb{position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;gap:8px;align-items:center;min-height:40px;padding:6px 14px;font:700 13px var(--fb);background:rgba(8,10,20,.62)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;border-radius:12px!important;box-shadow:none!important;clip-path:none!important;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.lfr{display:grid;gap:6px}.lfl{font-size:12px;font-weight:800;color:var(--muted)}
.seg2{display:flex;flex-wrap:wrap;gap:6px}.seg2 button{flex:1 1 auto;min-height:38px;padding:6px 10px;font-size:13px;white-space:nowrap}
.lfr2{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}.lfr2 select{min-width:0;width:100%}.lfr2 input{grid-column:1/-1;min-width:0;width:100%}
.lchk{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:8px 12px;border:1px solid var(--line);border-radius:max(var(--r),4px);cursor:pointer;font-weight:700;font-size:14px;min-height:44px}
.lff{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}.lff::-webkit-scrollbar{display:none}
.lff button{flex:none;min-height:36px;padding:6px 12px;font-size:13px;white-space:nowrap}
.lfc{padding:12px;margin-bottom:10px;border:1px solid var(--line);border-radius:max(var(--r),4px);background:rgba(0,0,0,.18);animation:fadeUp .4s var(--ez) both}
.lfc.mine{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.lfh{display:flex;align-items:center;gap:10px;cursor:pointer}.lfh .t{flex:1;min-width:0}.lfh .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lfh small{color:var(--muted);font-size:12px}
.lfleft{flex:none;font-size:11px;font-weight:800;color:var(--muted);padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.06)}
.lftx{margin:8px 0 2px;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.lft{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.lft .chip.need{border-color:var(--accent);color:var(--accent)}
.avd{position:relative;flex:none;display:inline-block}
.avd .odot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:var(--ok);border:2px solid var(--card);animation:livePulse 2.4s ease-out infinite}
.lfrs{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}
.lfst{display:flex}.lfst .pav{width:26px;height:26px;font-size:14px;border:2px solid var(--card);margin-left:-8px}.lfst .pav:first-child{margin-left:0}
.lfrl{margin-top:8px;display:grid;gap:6px}.lfrl .item{padding:8px 10px}
.lfb{margin-top:10px;gap:8px}.lfb button{min-height:44px}
button.on2{border-color:var(--ok)!important;color:var(--ok)!important}
/* ===== Играю в, подарок ===== */
.playing{color:var(--ok)!important;font-weight:700}
.pro-s .playing{padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--ok) 16%,transparent)}
.plb{margin-top:8px;min-height:36px;padding:6px 12px;font-size:13px}
.plg{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.plg button{min-height:40px;font-size:14px;padding:8px 12px}
.chest .gfw{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chest .gft{flex:1 1 160px;min-width:0}
.gfi{width:64px;height:64px;padding:0!important;font-size:40px;line-height:1;background:none!important;border:0!important;box-shadow:none!important;clip-path:none!important;flex:none}
.gfi.ready{animation:chestBob 1.6s ease-in-out infinite;filter:drop-shadow(0 0 12px var(--warn))}
.gfi.done{filter:grayscale(1);opacity:.55}
.gfi.shake{animation:chestShake .9s ease-in-out}
@keyframes chestBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(-4deg)}}
@keyframes chestShake{0%,100%{transform:none}15%{transform:rotate(-14deg) scale(1.1)}30%{transform:rotate(12deg) scale(1.15)}45%{transform:rotate(-10deg) scale(1.2)}60%{transform:rotate(8deg) scale(1.25)}80%{transform:scale(1.5);opacity:0}}
.gfb{flex:1 1 100%}
.chest .gft b{display:block;font-size:17px}
.ptg{display:grid;gap:8px;margin:10px 0}.ptg .lchk{min-height:42px}
/* Что нового */
#nwl{position:relative;padding-left:26px}
#nwl::before{content:'';position:absolute;left:9px;top:22px;bottom:22px;width:2px;border-radius:2px;background:linear-gradient(var(--accent),color-mix(in srgb,var(--accent) 8%,transparent))}
.nws{position:relative;animation:fadeUp .45s var(--ez) both;animation-delay:calc(var(--k,0)*55ms)}
.nws::before{content:'';position:absolute;left:-23px;top:28px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid color-mix(in srgb,var(--accent) 55%,var(--line))}
.nws.new::before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 22%,transparent)}
.nws-h{display:flex;align-items:center;gap:12px}
.nws-h>div{flex:1;min-width:0}
.nws-h b{display:block;font:800 17px/1.25 var(--fh)}

.nws-e{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:24px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.nws-tag{flex:none;font:800 11px var(--fb);padding:3px 9px;border-radius:999px;background:var(--accent);color:var(--ai)}
.nws-l{margin:12px 0 0;padding-left:20px;display:grid;gap:7px;line-height:1.45}
.nws-l li::marker{color:var(--accent)}
.nws-go{margin-top:12px;min-height:40px;padding:8px 16px}
.nwc{display:flex;align-items:center;gap:12px;cursor:pointer}
.nwc .t{flex:1;min-width:0}
.nwc .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nwc .t small{display:block;color:var(--accent);font-weight:800;font-size:12px}
.nwc .pill{flex:none;margin:0}
/* Игровые аккаунты */
.gac{display:grid;gap:8px;margin:4px 0 8px}
.gac-h{font-size:12px;font-weight:800;color:var(--muted)}
.gac-r{display:flex;flex-wrap:wrap;gap:8px}
button.gac-c{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px 6px 8px;max-width:100%;text-align:left;font-weight:700}
.gac-i{flex:none;width:32px;height:32px;display:grid;place-items:center;font-size:17px;border-radius:8px;background:rgba(255,255,255,.07)}
.gac-t{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.gac-t small{font-size:11px;color:var(--muted);font-weight:700}
.gac-t b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
.gac-c .i{width:16px;height:16px;flex:none;opacity:.55}
.gac-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.gac-l{display:grid;gap:6px;font-size:13px;font-weight:700;min-width:0}
.gac-lh{display:flex;align-items:center;gap:8px}
.gac-lh .gac-i{width:26px;height:26px;font-size:15px}
.gac-l input{width:100%;min-width:0;margin:0}
#megid .empty,#merep .rpu{margin-bottom:4px}
/* Репутация */
.rpu{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rpu-c{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 6px;border:1px solid var(--line);border-radius:max(var(--r),4px);background:rgba(0,0,0,.18);min-width:0}
.rpu-c.z{opacity:.5}
.rpu-i{font-size:22px;flex:none}
.rpu-c>div{min-width:0;max-width:100%}
.rpu-c b{display:block;font:800 18px/1.1 var(--fh)}
.rpu-c small{display:block;font-size:11px;color:var(--muted);font-weight:700;overflow-wrap:anywhere;line-height:1.2}
.rpu-b{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.rpu-b button{flex:1 1 auto;min-height:42px;font-size:14px;padding:8px 10px}
.rpw{margin:0 0 6px}
.rpw .muted{margin-top:10px}
.rpu-n{margin-top:10px}
/* Пати */
.pty-h{display:flex;align-items:center;gap:10px}
.pty-h.click{cursor:pointer}
.pty-h .t{flex:1;min-width:0}
.pty-h .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pty-h small{color:var(--muted);font-size:12px}
.pty-g{flex:none;width:42px;height:42px;display:grid;place-items:center;font-size:22px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent)}
.pty-s{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pty-m,.pty-e{position:relative;flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.pty-m .pav{width:100%;height:100%;font-size:20px}
.pty-m.own .pav{box-shadow:0 0 0 2px var(--accent)}
.pty-m .odot{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.pty-e{border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--muted);font-weight:800}
.pty-s.big .pty-m,.pty-s.big .pty-e{width:48px;height:48px}
.pty-s.big .pty-m .pav{font-size:26px}
.pty-c.full{opacity:.65}
.pty-me{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.pty-me.full .pty-m{animation:ptyPop .5s var(--ez) both}
.pty-ok{margin:4px 0 10px;padding:10px 12px;border-radius:max(var(--r),4px);background:color-mix(in srgb,var(--ok) 16%,transparent);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);font-weight:800}
.pty-l{display:grid;gap:6px;margin-bottom:4px}
.pty-l .item{margin:0}
.pty-l .item.click{cursor:pointer}
.invc .pty-s{margin:2px 0}
@keyframes ptyPop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.nws,.pty-me.full .pty-m{animation:none}}

/* Тестеры */
.bt-h{display:flex;align-items:center;gap:12px}
.bt-h>div{flex:1;min-width:0}
.bt-h b{display:block;font:800 16px/1.25 var(--fh)}

.bt-i{flex:none;width:44px;height:44px;display:grid;place-items:center;font-size:24px;border-radius:12px;background:color-mix(in srgb,var(--accent) 16%,transparent)}

#hmbeta{display:flex;align-items:center;padding:0;overflow:hidden}
.btrow{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:0;margin:0;background:transparent!important;color:var(--ink)!important;border:0!important;box-shadow:none!important;clip-path:none!important;text-align:left;font:inherit;text-transform:none!important;letter-spacing:0!important;border-radius:0}
.btrow .bt-i{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.07);font-size:0}
.btrow .bt-i svg.i{width:22px;height:22px}
.bt-x{flex:1;min-width:0;display:block}
.bt-x b{display:block;font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt-x small{display:block;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.btrow>svg.i{flex:none;width:20px;height:20px;color:var(--muted)}
.bt-cl{flex:none;align-self:center;margin-right:6px}
.bellb{position:relative;width:44px;height:44px;min-height:0;padding:0;flex:none;background:transparent!important;color:var(--ink)!important;border:0!important;box-shadow:none!important;clip-path:none!important}
.bellb svg.i{width:22px;height:22px}
.bellb .bbdg{position:absolute;top:4px;right:2px;margin:0;min-width:18px;height:18px;padding:0 5px;display:grid;place-items:center;font-size:11px;line-height:18px;border:2px solid var(--bg)}
.top .live{display:none}
#menub.has::after{display:none}
.nf-i{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.07)}
.nf-r .bdg{margin-left:auto}

/* ===== Стиль Minimal ===== */
:root[data-game]{
  --bg:#0D0F14;--card:#151821;--card-hover:#1B1F2A;--border:rgba(255,255,255,.06);--text:#F2F3F5;--text-muted:#8A8F9C;
  --accent:#E8323F;--accent-hover:#FF4452;--reward:var(--accent);--on-reward:var(--ai);--radius:16px;--radius-sm:12px;
  --ink:var(--text);--muted:var(--text-muted);--line:var(--border);--ai:#fff;--ok:#3BAF73;--warn:#F2F3F5;--glow:rgba(232,50,63,.22);
  --fh:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--fb:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--fhw:600;
  --r:16px;--hs:22px;--bw:0px;--bc:transparent;--btnbg:var(--accent);--btnsh:none;--gap:12px}
:root[data-game] body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--fb);letter-spacing:0}
:root[data-game] body::before,:root[data-game] body::after{display:none}
:root[data-game] .wrap{padding-left:16px;padding-right:16px}
:root[data-game] .top{margin-left:-16px;margin-right:-16px;padding-left:12px;padding-right:12px;background:color-mix(in srgb,var(--bg) 92%,transparent)}
:root[data-game] :is(h1,h2,.dh){font-family:var(--fb);font-weight:600;text-shadow:none;letter-spacing:0;text-transform:none;color:var(--text)}
:root[data-game] #cur{font-size:22px;font-weight:600}
:root[data-game] #cur svg.i{color:var(--accent)}
:root[data-game] svg.i{stroke-width:1.75}
:root[data-game] b,:root[data-game] strong{font-weight:600}
:root[data-game] .muted{font-size:13px;color:var(--muted)}
:root[data-game] small{font-weight:400}
/* карточки */
:root[data-game] .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:none}
:root[data-game] .box::before,:root[data-game] .box::after{display:none}
:root[data-game] .box>b:first-child,:root[data-game] .bh b{font-size:17px;font-weight:600;font-family:var(--fb)}
:root[data-game] .bh svg.i{color:var(--text-muted)}
:root[data-game] :is(.item,.accu,.stc,.ach,.mdi,.nwi){background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:none}
:root[data-game] .sec .box .item{background:var(--card-hover);border-color:transparent}
:root[data-game] .item.click:hover,:root[data-game] .op:hover{outline:0;background:var(--card-hover)}
:root[data-game] .empty{background:transparent;border:1px dashed rgba(255,255,255,.1);border-radius:12px;color:var(--muted)}
:root[data-game] .empty .ei{animation:none}
/* кнопки */
:root[data-game] button{font:600 15px var(--fb);border-radius:14px;box-shadow:none;text-shadow:none;text-transform:none;letter-spacing:0;font-style:normal;clip-path:none;background:var(--accent);color:var(--ai);border:0}
:root[data-game] button:not(.g):not(.x):not(.tab):not(.mi):not(.bellb):not(.btrow):not(.mebtn):not(.avb):not(.sw2):not(.hex):not(:disabled):hover{background:var(--accent-hover);filter:none}
:root[data-game] button.g{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
:root[data-game] button.g:hover{background:rgba(255,255,255,.04);filter:none}
:root[data-game] button.g.on{background:var(--accent);border-color:var(--accent);color:var(--ai)}
:root[data-game] button.x{background:transparent;color:var(--muted)}
:root[data-game] :is(button.w:not(.g):not(.danger),.qmb){min-height:56px;font-size:17px;font-weight:600;border-radius:14px}
:root[data-game] button.w.g{min-height:48px}
:root[data-game] .btnlink{border:1px solid rgba(255,255,255,.12);border-radius:14px;font:600 15px var(--fb);color:var(--text);background:transparent}
:root[data-game] .btnlink.w:not(.g){background:var(--accent);border-color:var(--accent);color:var(--ai);min-height:56px;font-size:17px}
:root[data-game] .pill{min-height:34px;border-radius:999px;font:600 13px var(--fb)}
:root[data-game] button.danger{background:transparent;color:#ff6b74;border:1px solid rgba(232,50,63,.45)}
:root[data-game] :is(input,select,textarea){background:var(--card-hover);border:1px solid var(--border);border-radius:12px;font:400 15px var(--fb);color:var(--text)}
:root[data-game] :is(input,select,textarea):focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
:root[data-game] :is(button,input,select,textarea,.item.click):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:root[data-game] .chip{background:var(--card-hover);border:0;border-radius:8px;font:500 13px var(--fb);color:var(--text)}
:root[data-game] .hchip{background:var(--card-hover);font-weight:500}
:root[data-game] .bdg{background:var(--accent);color:var(--ai);font:600 11px var(--fb)}
/* прогресс */
:root[data-game] .xpb{height:6px;border:0;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:none}
:root[data-game] .xpb .pb,:root[data-game] .pb{background:var(--reward)!important;border-radius:999px;box-shadow:none}
:root[data-game] .rwbar{height:6px;background:rgba(255,255,255,.06)}:root[data-game] .rwbar i{background:var(--reward)}
/* верхняя панель и меню */
:root[data-game] #menub{background:transparent;border:0;color:var(--text);width:44px}
:root[data-game] .mebtn{border:0!important;width:36px;height:36px}
:root[data-game] .dr{background:var(--bg);border-right:1px solid var(--border)}
:root[data-game] .mi{border:0;border-radius:12px;font:500 15px var(--fb);color:var(--text);background:transparent;min-height:46px}
:root[data-game] .mi svg.i{color:var(--text-muted)}
:root[data-game] .mi.on{background:var(--card);color:var(--text)}
:root[data-game] .mi.on svg.i{color:var(--accent)}
:root[data-game] :is(.mg,.ds){font:500 13px var(--fb);color:var(--text-muted);text-transform:none;letter-spacing:0}
:root[data-game] .grid .mi,:root[data-game] .seg .mi{background:var(--card);border:1px solid var(--border)}
:root[data-game] .grid .mi.on,:root[data-game] .seg .mi.on{background:var(--card-hover);border-color:var(--accent)}
:root[data-game] .sw{border-color:rgba(255,255,255,.25)}
/* нижнее меню */
:root[data-game] .tabbar{background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--border)}
:root[data-game] .tab{font:500 11px var(--fb)!important;color:var(--text-muted)!important}
:root[data-game] .tab .tic{background:transparent!important;box-shadow:none!important}
:root[data-game] .tab.on{color:var(--accent)!important}
:root[data-game] .tab.on::after{content:'';position:absolute;left:50%;bottom:1px;width:18px;height:3px;margin-left:-9px;border-radius:3px;background:var(--accent)}
:root[data-game] .tab.on .tic .pav{border-color:var(--accent)}
/* листы, тосты, награды */
:root[data-game] .sh{background:var(--bg);border-color:var(--border)}
:root[data-game] .toast{background:var(--card-hover);color:var(--text);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:500}
:root[data-game] .rw{background:var(--card);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.4);-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-game] .rw.lvl{border-color:var(--reward);box-shadow:0 8px 24px rgba(0,0,0,.4)}
:root[data-game] .rwi{background:var(--card-hover);border-radius:50%}
:root[data-game] .rwn{font:600 26px/1 var(--fb);color:var(--reward);text-shadow:none}
/* главная */
:root[data-game] .hero .pav{animation:none;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
:root[data-game] .hero b{font-size:20px;font-weight:600}
:root[data-game] .qa{gap:12px;margin-bottom:12px}
:root[data-game] .qa button{background:var(--card);border:1px solid var(--border);color:var(--text);font:500 13px var(--fb);min-height:108px;gap:10px;border-radius:16px}
:root[data-game] .qa button:hover{background:var(--card-hover)}
:root[data-game] .qa svg.i{width:48px;height:48px;padding:13px;border-radius:50%;background:var(--card-hover);color:var(--text)}
:root[data-game] .qa button span{display:block}
:root[data-game] .gfi{background:var(--card-hover)!important;width:48px;height:48px;filter:none!important;animation:none!important}
:root[data-game] .gfi svg.i{width:22px;height:22px}
:root[data-game] .gfi.ready svg.i{color:var(--accent)}
:root[data-game] .btrow .bt-i,:root[data-game] .nf-i{background:var(--card-hover)}
:root[data-game] .btrow .bt-i svg.i{color:var(--text)}
:root[data-game] .nwc{background:var(--card)}
:root[data-game] .nwc::before,:root[data-game] .nwc::after{display:none}
:root[data-game] .avrow .op .pav{box-shadow:none}
/* профиль */
:root[data-game] .pro-av .pav:not([class*=fr]){box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
:root[data-game] .pro-av.off .pav:not([class*=fr]){box-shadow:0 0 0 2px var(--card),0 0 0 4px #3a3f4b}
:root[data-game] .pro-dot{animation:none}
:root[data-game] .pro-lv .xpb .pb{background:var(--reward)}
:root[data-game] .pro-eb{background:rgba(13,15,20,.7)!important;border:1px solid rgba(255,255,255,.12)!important;box-shadow:none!important}
:root[data-game] .pav[class*=fr]{animation:none}
:root[data-game] :is(.hex:not(.lk))::after,:root[data-game] .ach:not(.off)::after{display:none}
:root[data-game] .hex{background:rgba(255,255,255,.1)!important}
:root[data-game] .hex span{background:var(--card-hover)}
:root[data-game] .hexl{background:var(--reward);color:var(--on-reward)}
:root[data-game] .gcard{background:var(--card-hover);border-color:transparent}
:root[data-game] .dot:not(.off){animation:none}
:root[data-game] .cldesc{border-left-color:var(--accent);background:var(--card-hover)}
:root[data-game] .bub{background:var(--card-hover);border-color:transparent}
:root[data-game] .msg.me .bub{background:var(--accent);color:var(--ai)}
:root[data-game] .qi.done .qc{background:var(--reward);border-color:var(--reward);color:var(--on-reward)}
:root[data-game] .qi .qx{color:var(--reward)}
:root[data-game] #splash img{filter:drop-shadow(0 12px 24px rgba(0,0,0,.55))}
:root[data-game] #rx{border-radius:16px}
/* второстепенные кнопки на главной — акцент только у «Найти тиммейта» */
:root[data-game] #s-home :is(button.w:not(.qmb),.gfb){background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12);min-height:48px;font-size:15px}
:root[data-game] #s-home :is(button.w:not(.qmb),.gfb):hover{background:rgba(255,255,255,.04)!important}
:root[data-game] .nwc .pill{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
:root[data-game] .nws-e{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--card-hover);font-size:22px}
:root[data-game] .nws-e svg.i{width:22px;height:22px;color:var(--text)}
:root[data-game] .hero b{color:var(--text)!important}
:root[data-game] .metb :is(#meedit,#meprev){min-height:48px;font-size:15px}
:root[data-game] .uid{font:400 12px var(--fb)}
:root[data-game] .pro-stats{background:var(--card-hover);border-color:transparent}
:root[data-game] .pro-st+.pro-st{border-left-color:rgba(255,255,255,.06)}
:root[data-game] .pro-st .i{color:var(--text-muted)}
:root[data-game] .rpu-c{background:var(--card-hover);border-color:transparent}
:root[data-game] .rpu-i svg.emi{width:22px;height:22px;margin:0;color:var(--text)}
/* выбранный сегмент — нейтральный, акцент только у главных действий */
:root[data-game] button.g.on{background:var(--text);border-color:var(--text);color:var(--bg)}
:root[data-game] :is(.item,.accu,.mrow,#ptl) button:not(.g):not(.x):not(.danger):not(.danger2):not(.avb),
:root[data-game] .sec .box button.w:not(.g)~button.w:not(.g){background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
:root[data-game] :is(.item,.accu,.mrow,#ptl) button:not(.g):not(.x):not(.danger):not(.danger2):not(.avb):not(:disabled):hover,
:root[data-game] .sec .box button.w:not(.g)~button.w:not(.g):not(:disabled):hover{background:rgba(255,255,255,.04)}
:root[data-game] :is(.xog,.rpsb) button{background:var(--card-hover);color:var(--text);border:0}
:root[data-game] .xog button.X{color:var(--accent)}:root[data-game] .xog button.O{color:var(--text)}
:root[data-game] #rx{background:var(--card-hover);color:var(--text)}
:root[data-game] .cpsb:not(.go){background:var(--card-hover);color:var(--text)}
:root[data-game] .pill:not(.on){background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
:root[data-game] :is(.item.mine,.chl .item.mine){outline:1px solid rgba(255,255,255,.22);outline-offset:-1px}
:root[data-game] .nwc small{color:var(--text-muted)}
:root[data-game] .nws-l li::marker{color:var(--text-muted)}
:root[data-game] .metb button{white-space:nowrap;padding:0 14px}
:root[data-game] .strk{color:var(--text)}:root[data-game] .strk svg.emi{color:var(--accent)}
:root[data-game] #nwl::before{background:rgba(255,255,255,.08)}
:root[data-game] .pv-note{color:var(--text-muted);font-weight:500}
:root[data-game] .metb{grid-template-columns:minmax(0,1fr) auto}
:root[data-game] .metb button{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:380px){:root[data-game] .metb :is(#meedit,#meprev){padding:0 10px;font-size:14px;gap:6px}}
.qmc{break-inside:avoid;-webkit-column-break-inside:avoid;display:flow-root}
:root[data-game] .rk.rk3{color:var(--reward);font-weight:600}
:root[data-game] .pty-ok{background:var(--card-hover);color:var(--text);border:0}
:root[data-game] .pty-ok svg.emi{color:var(--accent)}
:root[data-game] :is(button.avb,.stkp button){background:transparent}
:root[data-game] .bdg.mut{background:rgba(255,255,255,.14);color:var(--text)}
:root[data-game] .chh .chmu.on,.chh .chmu.on{background:transparent!important;color:var(--muted)!important;border:1px solid var(--line)!important}
.pubav svg.i{width:22px;height:22px;color:var(--ink)}
:root[data-game] .pubav{background:var(--card-hover);border-color:transparent}
/* ===== Цвета профиля ===== */
.pct{margin-top:16px}.pct b{display:block;font-size:15px}
.pcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:10px}
.pcs{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0;margin:0;padding:12px 6px 10px;background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:14px!important;box-shadow:none!important;font:500 13px/1.2 var(--fb)!important;text-align:center;cursor:pointer}
.pcs .pcd{width:36px;height:36px;border-radius:50%;background:var(--sw);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.pcs .pcd svg.i{width:18px;height:18px;color:#0D0F14;stroke-width:3;opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.pcs.on{border-color:var(--sw)!important;box-shadow:0 0 0 1px var(--sw) inset!important}
.pcs.on .pcd svg.i{opacity:1;transform:none}
.pcs.lk .pcd{filter:saturate(.35) brightness(.55)}
.pcs.lk .pcd svg.i{opacity:1;transform:none;color:#fff;stroke-width:2}
.pcs.lk .pcn{color:var(--muted)}
.pcs .pch{display:block;font-size:11px;line-height:1.25;color:var(--muted)}
@media (hover:hover){.pcs:not(.lk):hover{background:rgba(255,255,255,.04)!important}}
.pcs:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pro.pcol{border:1px solid color-mix(in srgb,var(--pc) 40%,transparent)!important;box-shadow:0 8px 22px -12px color-mix(in srgb,var(--pc) 50%,transparent)!important}
.pro.pcol .pro-av .pav:not([class*=fr]),:root[data-game] .pro.pcol .pro-av .pav:not([class*=fr]){box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--pc)!important}
:root[data-game] #hm1 .hero .pav{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--pc,var(--accent))}
/* ===== Главная: раскладка, «В сети», задания, лента клана ===== */
.htop{display:flex;flex-direction:column}
.hcol{display:contents}
#hm1{order:0}#hmqm{order:1}#hmonb{order:2}#hmqst{order:3}#hmchest{order:4}#hmclf{order:5}
.bh2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.bh2 b{font-size:17px}
#hmonb .avrow{gap:14px;padding:4px 2px 4px;margin:0 -4px;scrollbar-width:none;cursor:grab;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#hmonb .avrow::-webkit-scrollbar{display:none}
#hmonb .avrow.drag{cursor:grabbing;user-select:none}
#hmonb .avrow.drag .op{pointer-events:none}
#hmonb .op{display:flex;flex-direction:column;align-items:center;gap:6px;width:64px;min-height:0;padding:2px 0;margin:0;flex:none;background:transparent!important;border:0!important;box-shadow:none!important;color:var(--ink)!important;font:500 12px var(--fb)!important}
#hmonb .oav{position:relative;display:block}
#hmonb .oav .pav{width:56px;height:56px;font-size:30px}
#hmonb .op.fr .oav .pav{box-shadow:0 0 0 2px var(--card),0 0 0 4px color-mix(in srgb,var(--ok) 70%,transparent)}
#hmonb .odot{position:absolute;right:1px;bottom:1px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:3px solid var(--card)}
#hmonb .onm{max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hinv{display:flex;align-items:center;gap:12px}.hinv .t{flex:1;min-width:0}.hinv b{display:block;font-size:15px}.hinv small{display:block;color:var(--muted);font-size:13px}
.hq-n{font-weight:600;color:var(--reward,var(--accent))}
.hq-bar{margin:0 0 6px}
.hq{display:flex;align-items:center;gap:12px;width:100%;min-height:0;margin:0;padding:10px 0;background:transparent!important;border:0!important;border-bottom:1px solid var(--line)!important;border-radius:0!important;box-shadow:none!important;color:var(--ink)!important;font:500 15px var(--fb)!important;text-align:left}
.hq:last-of-type{border-bottom:0!important}
.hq-i{flex:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.06)}
.hq-i svg.i{width:20px;height:20px}
.hq-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hq-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== Анимации: один стиль, быстро и мягко ===== */
:root{--t-fast:.15s;--t:.22s;--t-slow:.35s}
.toast:not(.on){pointer-events:none}
@media (prefers-reduced-motion:no-preference){
@keyframes mvIn{from{opacity:0;translate:0 8px}to{opacity:1;translate:0 0}}
@keyframes mvFade{from{opacity:0}to{opacity:1}}
@keyframes rowCas{from{opacity:0;translate:0 6px}to{opacity:1;translate:0 0}}
@keyframes rowIn{from{opacity:0;scale:.97}to{opacity:1;scale:1}}
@keyframes rowOut{from{opacity:1;translate:0 0}to{opacity:0;translate:-12px 0}}
@keyframes xfIn{from{opacity:.35}to{opacity:1}}
@keyframes nBump{0%{scale:1}45%{scale:1.15}100%{scale:1}}
@keyframes bPop{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
@keyframes pkDone{0%{scale:.97;border-color:var(--accent)}35%{scale:1;border-color:var(--accent)}100%{scale:1;border-color:var(--line)}}
/* 1. смена вкладок */
.sec.on{animation:none!important}
.sec.on>*,#s-home.on .hcol>*{animation:mvIn var(--t) var(--ez) backwards!important;animation-delay:0s!important}
#cur span.tin{animation:mvFade var(--t-fast) ease both!important}
/* 2. каскад строк при первом показе */
.cin{animation:rowCas var(--t) var(--ez) backwards!important;animation-delay:calc(var(--ci,0)*30ms)!important}
/* 3. добавление и удаление */
.rin{animation:rowIn var(--t) var(--ez) backwards!important}
.rout{animation:rowOut var(--t-fast) ease forwards!important;pointer-events:none}
.msgin{animation:rowIn var(--t) var(--ez) both!important}
/* 4. меню ⋯ и статуса */
.pmenu{animation:none!important;opacity:0;scale:.96;transition:opacity var(--t-fast) var(--ez),scale var(--t-fast) var(--ez)}
.pmenu.in{opacity:1;scale:1;transition-duration:var(--t)}
.pmenu.out{opacity:0;scale:.96;transition-duration:var(--t-fast)}
/* 5. шторки и окна */
.ov,.ov2{transition:opacity var(--t) ease!important}
.sh{transition:transform var(--t-slow) var(--ez),visibility 0s var(--t-slow)!important}
body.sheet .sh{transition:transform var(--t-slow) var(--ez)!important}
@media (min-width:1024px){
  .sh{transform:translate(-50%,-50%)!important;scale:.97;opacity:0;transition:scale var(--t) var(--ez),opacity var(--t) ease,visibility 0s var(--t)!important}
  body.sheet .sh{scale:1;opacity:1;transition:scale var(--t) var(--ez),opacity var(--t) ease!important}}
/* 6. тосты */
.toast{transform:translate(-50%,0)!important;opacity:0;translate:0 12px;transition:opacity var(--t) var(--ez),translate var(--t) var(--ez)!important;pointer-events:none}
.toast.on{opacity:1;translate:0 0}
.toast.on.act{pointer-events:auto}
/* 7. сегменты и фильтры */
:is(.seg,.tabs2,.lfmode,.lff,.achf,.bkf,.frseg,#clts) button,.mi{transition:background-color var(--t-fast) ease,border-color var(--t-fast) ease,color var(--t-fast) ease!important}
.xf{animation:xfIn var(--t-fast) ease both}
/* 8. кнопки и карточки */
button{transition:background-color var(--t-fast) ease,border-color var(--t-fast) ease,color var(--t-fast) ease,box-shadow var(--t-fast) ease,scale .1s ease}
button:active:not(:disabled):not(#cpsb):not(.xog button){scale:.97}
.item,.box,.gcard,.lfc,.ach{transition:background-color var(--t-fast) ease,border-color var(--t-fast) ease}
.bks{transition:color var(--t-fast) ease,background-color var(--t-fast) ease,border-color var(--t-fast) ease!important}
/* 9. цифры */
.nbump{display:inline-block;animation:nBump var(--t) var(--ez)}
/* 10. «Во что поиграть сегодня?» */
.pkc.done{animation:pkDone .6s var(--ez)!important}
/* 11. бейджи */
#chl .bdg{animation:none}
.bdg.bpop,.bbdg.bpop{animation:bPop var(--t) var(--ez)!important}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scale:none!important;translate:none!important}}
</style>
