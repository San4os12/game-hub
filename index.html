<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Russo+One&family=Comfortaa:wght@700&family=Nunito:wght@600;800&family=Oswald:wght@500;700&family=Exo+2:wght@600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#2b1d12;--card:#4a3322;--ink:#f4efe2;--muted:#c9bba1;--accent:#5b8c2a;--ai:#fff;--line:#1a110a;--ok:#7bc043;--warn:#f1c232;
--fh:"Press Start 2P","Courier New",monospace;--fb:Nunito,system-ui,sans-serif;--r:0px;--hs:13px;--bw:3px;--bc:#1a110a}
:root[data-game=roblox]{--bg:#1b1d21;--card:#2a2d33;--ink:#fff;--muted:#aeb4bf;--accent:#00a2ff;--ai:#fff;--line:#3d414a;--ok:#02b757;--warn:#ffb400;--fh:"Russo One",Verdana,sans-serif;--r:8px;--hs:22px;--bw:0px;--bc:transparent}
:root[data-game=sky]{--bg:#2a2a5a;--card:rgba(255,255,255,.14);--ink:#fff7ea;--muted:#e8d9ef;--accent:#f6c667;--ai:#2b2140;--line:rgba(255,255,255,.28);--ok:#9be8c0;--warn:#ffd98a;--fh:Comfortaa,sans-serif;--r:20px;--hs:22px;--bw:0px;--bc:transparent}
:root[data-game=cs16]{--bg:#2b3226;--card:#4c5844;--ink:#f1f1e4;--muted:#b8c2a8;--accent:#ffb000;--ai:#1d2218;--line:#232a1e;--ok:#9be36a;--warn:#ffb000;--fh:Tahoma,Verdana,sans-serif;--fb:Tahoma,Verdana,sans-serif;--r:0px;--hs:20px;--bw:2px;--bc:#1d2218}
:root[data-game=csgo]{--bg:#12161c;--card:#1d232c;--ink:#e8ecf2;--muted:#8e99a8;--accent:#de9b35;--ai:#14100a;--line:#2c3541;--ok:#6fcf7a;--warn:#de9b35;--fh:Oswald,Impact,sans-serif;--r:2px;--hs:26px;--bw:0px;--bc:transparent}
:root[data-game=cs2]{--bg:#0d1117;--card:rgba(28,35,46,.9);--ink:#eef3fa;--muted:#8d9bb0;--accent:#4aa3ff;--ai:#06101c;--line:#26303f;--ok:#5fdc8b;--warn:#ffb84a;--fh:"Exo 2",sans-serif;--fb:"Exo 2",sans-serif;--r:6px;--hs:24px;--bw:0px;--bc:transparent}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 var(--fb);min-height:100vh}
:root[data-game=minecraft] body{background-image:linear-gradient(90deg,rgba(0,0,0,.16) 50%,transparent 50%),linear-gradient(rgba(0,0,0,.16) 50%,transparent 50%);background-size:32px 32px}
:root[data-game=roblox] body{border-top:8px solid #e2231a}
:root[data-game=sky] body{background:linear-gradient(180deg,#1f2a5a,#6a4a8c 48%,#f0a27a) fixed}
:root[data-game=cs16] body{background-image:linear-gradient(rgba(0,0,0,.12) 50%,transparent 50%);background-size:100% 4px}
:root[data-game=csgo] body{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 14px)}
:root[data-game=cs2] body{background-image:radial-gradient(900px 420px at 50% -90px,rgba(74,163,255,.28),transparent)}
:root[data-game=cs2] :is(.box,.item,.live,.dr){backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:root[data-game=cs2] .box{border-top:2px solid var(--accent)}
:root[data-game=cs2] :is(h2,.ds){text-transform:uppercase;letter-spacing:.6px}
#bn{flex-basis:100%}
button.sw2{width:34px;height:34px;min-height:0;padding:0;border-radius:50%!important;border:3px solid transparent!important;box-shadow:none!important}
button.sw2.on{border-color:var(--ink)!important}
.msg{display:flex;margin:6px 0}.msg.me{justify-content:flex-end}
.bub{max-width:82%;padding:7px 11px 6px;border-radius:calc(var(--r)*1.5);background:rgba(0,0,0,.25);border:1px solid var(--line);line-height:1.35;overflow-wrap:anywhere}
.msg:not(.me) .bub{border-bottom-left-radius:2px}
.msg.me .bub{background:var(--accent);color:var(--ai);border-color:transparent;border-bottom-right-radius:2px}
.bn{font-weight:800;font-size:13px}
.bt{font-size:11px;opacity:.6;margin-left:10px;float:right;margin-top:6px}
.sysm{text-align:center;font-size:12px;color:var(--muted);margin:8px 0}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:10px}
h1,h2{font-family:var(--fh);font-weight:400;margin:0}
h1{flex:1;min-width:0;font-size:var(--hs);line-height:1.25;overflow-wrap:anywhere}
h2{display:flex;align-items:center;gap:10px;font-size:calc(var(--hs) - 4px);margin:16px 0 12px}
:root[data-game=roblox] h1{text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--muted)}
.box,.item,.live{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
:root[data-game=sky] :is(.box,.item,.live,.dr){backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
:root[data-game=minecraft] :is(.box,.item,.live,button:not(.mi)){border:4px solid var(--line);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.15)}
:root[data-game=roblox] .box{border-left:6px solid var(--accent)}
:root[data-game=csgo] .box{border-left:4px solid #5d79ae}
:root[data-game=cs16] :is(.box,.item,.live,button,input,select,textarea,.dr){border:2px solid;border-color:#9aa88c #1d2218 #1d2218 #9aa88c}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:800 15px var(--fb);cursor:pointer;color:var(--ai);background:var(--accent);border:var(--bw) solid var(--bc);border-radius:var(--r);padding:11px 16px;min-height:46px}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.g.on{background:var(--accent);color:var(--ai)}
:root[data-game=roblox] button{box-shadow:0 4px 0 rgba(0,0,0,.45)}
:root[data-game=csgo] :is(h1,h2,button,.ds){text-transform:uppercase;letter-spacing:.6px}
:root[data-game=csgo] button{font-family:var(--fh);font-weight:500}
:root[data-game=cs16] button{background:#4c5844;color:#ffb000}
:root[data-game=cs16] button.g{color:var(--ink)}
:root[data-game=cs16] :is(button.on,.mi.on){background:#2b3226;color:#ffb000;border-color:#1d2218 #9aa88c #9aa88c #1d2218}
.ib{width:46px;padding:0;display:grid;place-items:center;flex:none}
input,select,textarea{flex:1 1 120px;min-width:0;min-height:46px;font:600 16px var(--fb);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
:root[data-game=cs16] :is(input,select,textarea){background:#2b3226;border-color:#1d2218 #9aa88c #9aa88c #1d2218}
textarea{width:100%;min-height:90px;margin-top:8px;resize:vertical}
select option{color:#111;background:#fff}
input[type=checkbox]{flex:none;width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent)}
:is(button,input,select,textarea):focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.sec{display:none}.sec.on{display:block}
.box{padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.w{width:100%;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}.item small{display:block;color:var(--muted)}
.x{background:transparent;color:var(--muted);padding:2px 10px;min-height:36px;font-size:20px;border:0;box-shadow:none}
.pill{font-size:12px;padding:6px 12px;min-height:34px}
.muted{color:var(--muted);font-size:14px}
.big{font:800 28px var(--fb);text-align:center;margin:10px 0}
:root[data-game=minecraft] .big{font:400 15px/1.6 var(--fh)}
.pk{text-align:center;font-weight:800;font-size:18px;margin-top:10px;min-height:26px}
#rx{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:20px;font-weight:800;cursor:pointer;user-select:none;background:var(--accent);color:var(--ai);border-radius:var(--r)}
.pb{height:10px;border-radius:var(--r);background:var(--accent);margin-top:6px}
/* меню */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);overflow-y:auto;z-index:40;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));background:var(--bg);border:0;border-right:1px solid var(--line);transform:translateX(-103%);visibility:hidden;transition:transform .22s,visibility 0s .22s}
body.open .ov{opacity:1;pointer-events:auto}
body.open .dr{transform:none;visibility:visible;transition:transform .22s}
.dh{display:flex;align-items:center;justify-content:space-between;font:400 calc(var(--hs) - 3px) var(--fh)}
.ds{font:800 12px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:20px 4px 8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;margin-bottom:6px;padding:0 12px;text-align:left;font:800 16px var(--fb);background:transparent;color:var(--ink);border:1px solid var(--line)}
.mi.on{background:var(--accent);color:var(--ai)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .mi{margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg .mi{margin:0;justify-content:center}
.sw{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.6)}
#mi{counter-reset:mi}
:root[data-game=cs16] #mi .mi{counter-increment:mi}
:root[data-game=cs16] #mi .mi::before{content:counter(mi) ".";color:#ffb000;min-width:1.3em}
/* профиль, лист, рекорды, XO */
.pav{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:22px;line-height:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:50%}
.pav.sm{width:34px;height:34px;font-size:18px}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:10px}.ph .pav{width:64px;height:64px;font-size:34px}.ph b{display:block;font-size:20px;overflow-wrap:anywhere}.ph small{color:var(--muted)}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stc{text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}.stc b{display:block;font-size:18px}.stc small{color:var(--muted);font-size:12px}
.avr{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
button.avb{width:40px;height:40px;min-height:0;padding:0;font-size:20px;background:transparent;border:2px solid transparent!important;box-shadow:none!important;border-radius:50%!important}
button.avb.on{border-color:var(--accent)!important;background:rgba(255,255,255,.08)}
.item.click{cursor:pointer}.item.mine{outline:2px solid var(--accent);outline-offset:-2px}
.rk{width:24px;flex:none;text-align:center;font-weight:800;color:var(--muted)}
.val{font-weight:800;white-space:nowrap}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.xog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:12px auto}
.xog button{aspect-ratio:1;min-height:0;font-size:40px;font-weight:800;padding:0;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line)}
.xog button.X{color:var(--accent)}.xog button.O{color:var(--warn)}
.xst{text-align:center;font-weight:800;font-size:18px}
.bdg{margin-left:auto;background:#e74c3c;color:#fff;border-radius:999px;font:800 12px var(--fb);padding:2px 8px}
#menub{position:relative}
#menub.has::after{content:'';position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:#e74c3c;border:2px solid var(--bg)}
.ov2{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
body.sheet .ov2{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .22s,visibility 0s .22s}
body.sheet .sh{transform:none;visibility:visible;transition:transform .22s}
.shh{display:flex;justify-content:flex-end}
.dmv{max-height:48vh;min-height:120px;overflow-y:auto;margin:8px 0;padding:4px}
.accu{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:8px}
.accu b{display:block;overflow-wrap:anywhere}.accu small{color:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="g ib" id="menub" type="button"></button>
    <div style="flex:1"></div>
    <span class="live"><span class="dot off" id="dot"></span><b id="n">1</b><span data-i="online"></span></span>
  </div>
  <h2 id="cur"></h2>

  <div class="sec" id="s-back">
    <div class="box"><div class="row"><input id="bn" data-p="bn_ph" maxlength="60"><select id="bp"><option value="PC">PC</option><option value="PlayStation">PlayStation</option><option value="Xbox">Xbox</option><option value="Switch">Switch</option><option value="mobile" data-i="pm"></option></select><button id="ba" type="button" data-i="add"></button></div>
    <button class="g w" id="bd" type="button" data-i="dice"></button><div class="pk" id="bpick"></div></div>
    <div id="bl"></div>
  </div>

  <div class="sec" id="s-guide">
    <div class="box"><b id="gt"></b><div class="muted" data-i="g_hint"></div></div>
    <div id="gl"></div>
    <div class="box"><div class="row"><input id="gn" data-p="g_ph" maxlength="80"><button id="ga" type="button" data-i="add"></button></div></div>
  </div>

  <div class="sec" id="s-calc">
    <div class="box"><b data-i="c_t1"></b>
      <div class="row" style="margin-top:8px"><input id="cw" type="number" min="1" data-p="c_l"><input id="cl" type="number" min="1" data-p="c_w"><input id="ch" type="number" min="1" data-p="c_h"></div>
      <label class="row muted" style="margin-top:10px;align-items:center"><input type="checkbox" id="cf"><span data-i="c_hollow"></span></label>
      <button class="w" id="cb" type="button" data-i="c_btn"></button><div class="big" id="cr"></div></div>
    <div class="box"><b data-i="c_t2"></b>
      <div class="row" style="margin-top:8px"><input id="qn" type="number" min="0" data-p="c_items"><select id="qs"><option value="64" data-i="c_s64"></option><option value="16" data-i="c_s16"></option><option value="1" data-i="c_s1"></option></select></div>
      <button class="w" id="qb" type="button" data-i="c_btn"></button><div class="big" id="qr" style="font-size:20px"></div></div>
  </div>

  <div class="sec" id="s-react">
    <div class="box"><div id="rx"></div><div class="big" id="rt"></div><div class="muted" style="text-align:center" id="rb"></div></div>
    <div class="box"><b data-i="aim_t"></b><div id="aim" style="position:relative;height:260px;margin-top:10px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:manipulation"></div><div class="muted" style="text-align:center;margin-top:8px" id="aimi"></div><button class="w" id="aimb" type="button" data-i="aim_start"></button></div>
    <div class="box"><b data-i="lb_t"></b><div class="tabs2"><button class="g" id="lbr" type="button" data-i="lb_r"></button><button class="g" id="lba" type="button" data-i="lb_a"></button></div><div id="lbl"></div></div>
  </div>

  <div class="sec" id="s-lfg">
    <div class="box"><b data-i="lfg_t"></b><div class="muted" data-i="lfg_hint"></div>
      <select id="lfgg" style="width:100%;margin-top:8px"></select>
      <textarea id="lfgt" data-p="lfg_ph" maxlength="120" style="min-height:70px"></textarea>
      <button class="w" id="lfgb" type="button"></button></div>
    <div class="box"><b data-i="lfg_list"></b><div id="lfl" style="margin-top:8px"></div></div>
  </div>

  <div class="sec" id="s-xo">
    <div class="box" id="xob"></div>
    <div class="box"><b data-i="xo_games"></b><div id="xol" style="margin-top:8px"></div></div>
    <div class="box"><b data-i="xo_new"></b><div id="xop" style="margin-top:8px"></div></div>
  </div>

  <div class="sec" id="s-vote">
    <div class="box"><b data-i="v_t"></b><div class="muted" data-i="v_hint"></div>
    <div class="row" style="margin-top:8px"><input id="vn" data-p="bn_ph" maxlength="40"><button id="va" type="button" data-i="v_btn"></button></div></div>
    <div id="vl"></div>
  </div>

  <div class="sec" id="s-tools">
    <div class="box"><b data-i="tm_t"></b><textarea id="tmn" data-p="tm_ph" maxlength="300" style="min-height:60px"></textarea><button class="w" id="tmb" type="button" data-i="tm_btn"></button><div id="tmr" style="margin-top:10px"></div></div>
    <div class="box"><b data-i="tt_t"></b><div class="big" id="ttv">00:00</div><div class="row"><button id="tts" type="button" style="flex:1"></button><button class="g" id="ttr" type="button" data-i="tt_reset"></button></div><div class="muted" id="ttb" style="text-align:center;margin-top:8px"></div></div>
    <div class="box"><b data-i="dc_t"></b><div class="row" style="margin-top:8px"><button id="dcc" type="button" style="flex:1" data-i="dc_coin"></button><button id="dcd" type="button" style="flex:1" data-i="dc_dice"></button></div><div class="big" id="dcr"></div></div>
  </div>

  <div class="sec" id="s-friends">
    <div class="box"><b data-i="f_t"></b><div class="row" style="margin-top:8px"><input id="fnick" data-p="f_nick" maxlength="16"><select id="fst"><option value="1" data-i="f_s1"></option><option value="2" data-i="f_s2"></option><option value="3" data-i="f_s3"></option></select></div><div id="fcol" class="row" style="margin-top:10px;gap:8px"></div><div class="avr" id="favr"></div><input id="ffav" data-p="p_fav_ph" maxlength="60" style="width:100%;margin-top:10px"><div class="muted" id="fstat" style="margin-top:8px"></div><button class="w" id="fping" type="button" data-i="f_ping"></button></div>
    <div class="box"><b data-i="ff_t"></b><div class="row" style="margin-top:8px"><input id="fq" data-p="ff_search" maxlength="40"><button id="fqb" type="button" data-i="ff_find"></button></div><div id="fqr" style="margin-top:8px"></div><div id="fmine" style="margin-top:8px"></div></div>
    <div class="box"><b data-i="f_list"></b><div id="fl" style="margin-top:8px"></div></div>
    <div class="box"><b data-i="dm_t"></b><div id="dml" style="margin-top:8px"></div></div>
    <div class="box"><b data-i="f_chat"></b><div id="fc" style="margin:8px 0;min-height:120px;max-height:320px;padding:4px;overflow-y:auto"></div><div class="row"><input id="fm" data-p="f_msg" maxlength="200"><button id="fsend" type="button" data-i="f_send"></button></div></div>
  </div>

  <div class="sec" id="s-diary">
    <div class="box"><input id="dg" data-p="d_game" maxlength="60" style="width:100%"><textarea id="dt" data-p="d_ph" maxlength="500"></textarea>
    <button class="w" id="da" type="button" data-i="d_save"></button></div>
    <div id="dl"></div>
  </div>
</div>

<div class="ov" id="ov"></div>
<aside class="dr" id="dr">
  <div class="dh"><b id="dtitle"></b><button class="g ib" id="dx" type="button"></button></div>
  <div class="ds" data-i="m_sec"></div><div id="mi"></div>
  <div class="ds" data-i="m_style"></div><div class="grid" id="ms"></div>
  <div class="ds" data-i="m_lang"></div><div class="seg" id="ml"></div>
  <div class="ds" data-i="acc"></div><div id="acc"></div>
</aside>

<div class="ov2" id="sov"></div>
<div class="sh" id="sheet" role="dialog"><div class="shh"><button class="g ib" id="sx" type="button">×</button></div><div id="sbody"></div></div>

  FB.fs.collection('scores').doc(FB.uid).set({nick:(prof.nick||'').slice(0,16),c:prof.c,av:prof.av,
    r:(best>=100&&best<=5000)?best:0,a:(aimBest>=0&&aimBest<=60)?aimBest:0}).catch(function(){});},1500);}
function startLb(){
  function rows(s){var o=[];s.forEach(function(d){var x=d.data();x.id=d.id;o.push(x);});return o;}
  FB.fs.collection('scores').where('r','>',0).orderBy('r').limit(10).onSnapshot(function(s){lbR=rows(s);rLb();},function(){});
  FB.fs.collection('scores').orderBy('a','desc').limit(10).onSnapshot(function(s){lbA=rows(s).filter(function(x){return x.a>0;});rLb();},function(){});}
function rLb(){
  $('lbr').classList.toggle('on',lbMode==='r');$('lba').classList.toggle('on',lbMode==='a');
  var l=$('lbl');l.innerHTML='';
  if(!FB){l.appendChild(el('div','muted',t('off_srv')));return;}
  var list=lbMode==='r'?lbR:lbA;
  if(!list.length){l.appendChild(el('div','muted',t('lb_empty')));return;}
  list.forEach(function(x,i){var r=el('div','item click'+(x.id===FB.uid?' mine':''));
    r.appendChild(el('span','rk',i<3?['🥇','🥈','🥉'][i]:String(i+1)));r.appendChild(el('span','pav sm',av(x.av)));
    var nb=el('b','t',s16(x.nick)||'…');nb.style.color=col(x.c);r.appendChild(nb);
    r.appendChild(el('span','val',lbMode==='r'?x.r+t('ms'):x.a+t('lb_hits')));
    r.onclick=function(){showProfile(x.id);};l.appendChild(r);});}
$('lbr').onclick=function(){lbMode='r';rLb();};$('lba').onclick=function(){lbMode='a';rLb();};

/* ===== Тиммейты ===== */
var lfg=[];
function lfgOpts(){var s=$('lfgg'),v=s.value;s.innerHTML='';
  Object.keys(GAMES).forEach(function(k){var o=el('option',null,GAMES[k].n);o.value=GAMES[k].n;s.appendChild(o);});
  var o=el('option',null,t('lfg_other'));o.value='—';s.appendChild(o);
  s.value=v||GAMES[game].n;}
function startLfg(){FB.fs.collection('lfg').orderBy('t','desc').limit(30).onSnapshot(function(s){lfg=[];s.forEach(function(d){var x=d.data();x.id=d.id;lfg.push(x);});rLfg();},function(){});}
function rLfg(){
  var l=$('lfl');l.innerHTML='';
  var mine=FB&&lfg.some(function(x){return x.id===FB.uid;});
  $('lfgb').textContent=t(mine?'lfg_upd':'lfg_post');
  if(!FB){l.appendChild(el('div','muted',t('off_srv')));return;}
  var list=lfg.filter(function(x){return Date.now()-tms(x.t)<3*3600000;});
  if(!list.length){l.appendChild(el('div','muted',t('lfg_empty')));return;}
  list.forEach(function(x){var me=x.id===FB.uid,r=el('div','item click'+(me?' mine':''));
    r.appendChild(el('span','pav sm',av(x.av)));
    var c=el('div','t'),nb=el('b',null,s16(x.nick)||'…');nb.style.color=col(x.c);c.appendChild(nb);
    c.appendChild(el('div',null,String(x.text||'').slice(0,120)));
    c.appendChild(el('small',null,(x.game&&x.game!=='—'?String(x.game).slice(0,20)+' · ':'')+ago(tms(x.t))));r.appendChild(c);
    if(me){var d=el('button','x','×');d.type='button';d.onclick=function(e){e.stopPropagation();FB.fs.collection('lfg').doc(FB.uid).delete().catch(function(){});};r.appendChild(d);}
    else{var b=el('button','pill',t('dm_write'));b.type='button';b.onclick=function(e){e.stopPropagation();openDm(x.id);};r.appendChild(b);}
    r.onclick=function(){showProfile(x.id);};l.appendChild(r);});}
$('lfgb').onclick=function(){var v=$('lfgt').value.trim();if(!v||!FB)return;
  FB.fs.collection('lfg').doc(FB.uid).set({nick:(prof.nick||'').slice(0,16),c:prof.c,av:prof.av,game:String($('lfgg').value).slice(0,20),text:v.slice(0,120),t:TS()})
    .then(function(){$('lfgt').value='';}).catch(function(){});};

/* ===== Крестики-нолики ===== */
var xos={},xoCur=null;
var LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(b){for(var i=0;i<LINES.length;i++){var q=LINES[i];if(b[q[0]]!=='-'&&b[q[0]]===b[q[1]]&&b[q[0]]===b[q[2]])return b[q[0]];}return b.indexOf('-')<0?'d':'';}
function myMark(g){return FB&&g.x===FB.uid?'x':'o';}
function opp(g){return myMark(g)==='x'?{id:g.o,n:g.on}:{id:g.x,n:g.xn};}
function startXo(){var box={};
  ['x','o'].forEach(function(f){FB.fs.collection('xo').where(f,'==',FB.uid).onSnapshot(function(s){
    s.docChanges().forEach(function(c){if(c.type==='removed')delete box[c.doc.id];else box[c.doc.id]=c.doc.data();});xos=box;rXo();},function(){});});}
function newXo(uid,nick){if(!FB||!uid||uid===FB.uid)return;
  FB.fs.collection('xo').add({x:FB.uid,o:uid,xn:(prof.nick||'').slice(0,16),on:s16(nick),b:'---------',turn:'x',w:'',t:TS()})
    .then(function(r){xoCur=r.id;rXo();}).catch(function(){});}
function xoMove(id,i){var g=xos[id];if(!g||g.w||g.turn!==myMark(g)||g.b.charAt(i)!=='-')return;
  var nb=g.b.slice(0,i)+g.turn+g.b.slice(i+1);
  FB.fs.collection('xo').doc(id).update({b:nb,turn:g.turn==='x'?'o':'x',w:winner(nb),t:TS()}).catch(function(){});}
function xoStatus(g){var m=myMark(g);if(g.w==='d')return t('xo_draw');if(g.w)return g.w===m?t('xo_win'):t('xo_lose');return g.turn===m?t('xo_my'):t('xo_their');}
function rXo(){
  var ids=Object.keys(xos).sort(function(a,b){return tms(xos[b].t)-tms(xos[a].t);});
  if(xoCur&&!xos[xoCur])xoCur=null;
  if(!xoCur){xoCur=ids.filter(function(id){var g=xos[id];return !g.w&&g.turn===myMark(g);})[0]||null;}
  var bx=$('xob');bx.innerHTML='';
  if(!FB){bx.appendChild(el('div','muted',t('off_srv')));}
  else if(!xoCur){bx.appendChild(el('div','muted',t('xo_pick')));}
  else{var g=xos[xoCur],o=opp(g),m=myMark(g);
    var h=el('div','xst',t('xo_vs')+(s16(o.n)||'…'));bx.appendChild(h);
    var grid=el('div','xog');
    for(var i=0;i<9;i++){(function(i){var c=g.b.charAt(i),b=el('button',c==='x'?'X':c==='o'?'O':'',c==='x'?'✕':c==='o'?'◯':'');b.type='button';
      b.disabled=!!g.w||g.turn!==m||c!=='-';b.onclick=function(){xoMove(xoCur,i);};grid.appendChild(b);})(i);}
    bx.appendChild(grid);bx.appendChild(el('div','xst',xoStatus(g)+' · '+(m==='x'?'✕':'◯')));
    var row=el('div','row');row.style.marginTop='10px';
    if(g.w){var a=el('button',null,t('xo_again'));a.type='button';a.style.flex='1';a.onclick=function(){newXo(o.id,o.n);};row.appendChild(a);}
    var d=el('button','g','×');d.type='button';d.onclick=function(){var id=xoCur;xoCur=null;FB.fs.collection('xo').doc(id).delete().catch(function(){});};row.appendChild(d);
    bx.appendChild(row);}
  var l=$('xol');l.innerHTML='';
  if(!ids.length)l.appendChild(el('div','muted',t('xo_none')));
  ids.slice(0,15).forEach(function(id){var g=xos[id],o=opp(g),r=el('div','item click'+(id===xoCur?' mine':''));
    var x=el('div','t');x.appendChild(el('b',null,t('xo_vs')+(s16(o.n)||'…')));x.appendChild(el('small',null,xoStatus(g)));r.appendChild(x);
    if(!g.w&&g.turn===myMark(g))r.appendChild(el('span','bdg','!'));
    r.onclick=function(){xoCur=id;rXo();window.scrollTo(0,0);};l.appendChild(r);});
  var pl=$('xop');pl.innerHTML='';
  var others=room?room.peers().filter(function(p){return p.kind==='viewer'&&!p.isMe&&p.by;}):[];
  if(!others.length)pl.appendChild(el('div','muted',t('xo_nobody')));
  others.forEach(function(p){var pr=p.presence||{},r=el('div','item');r.appendChild(el('span','pav sm',av(pr.av)));
    var nb=el('b','t',s16(pr.nick)||'…');nb.style.color=col(pr.c);r.appendChild(nb);
    var b=el('button','pill',t('xo_call'));b.type='button';b.onclick=function(){newXo(p.by,pr.nick);window.scrollTo(0,0);};r.appendChild(b);pl.appendChild(r);});
  if(FB)badge();}

/* ===== Аккаунт Google и синхронизация ===== */
var SYNC_KEYS=['hub.games','hub.diary','hub.best','hub.aim','hub.prof','hub.st3.mc','hub.st3.rb','hub.st3.sk','hub.st3.cs'];
var syncOn=false,syncBusy=false,cloudT=null;
function onSaved(k){if(syncOn&&SYNC_KEYS.indexOf(k)>=0)cloudSave();}
function isGoogle(){var u=FB&&FB.auth&&FB.auth.currentUser;return !!(u&&!u.isAnonymous);}
function clean(v){return JSON.parse(JSON.stringify(v==null?null:v));}
function cloudSave(){clearTimeout(cloudT);cloudT=setTimeout(function(){if(!syncOn||!FB)return;
  var st={};['mc','rb','sk','cs'].forEach(function(k){st[k]=ld('hub.st3.'+k,[]);});
  FB.fs.collection('users').doc(FB.uid).set(clean({games:games,diary:diary,steps:st,best:best||0,aim:aimBest||0,
    prof:{nick:prof.nick||'',st:prof.st||'1',c:prof.c,av:prof.av,fav:prof.fav||''}})).catch(function(){});},1500);}
function mergeList(a,b,key){var seen={},out=[];[].concat(Array.isArray(a)?a:[],Array.isArray(b)?b:[]).forEach(function(x){
  if(!x||typeof x!=='object')return;var k=key(x);if(seen[k])return;seen[k]=1;out.push(x);});return out;}
function doSync(){
  if(!isGoogle()||syncBusy)return;syncBusy=true;rAcc();
  FB.fs.collection('users').doc(FB.uid).get().then(function(s){
    var c=s.exists?(s.data()||{}):{};
    games=mergeList(ld('hub.games',games),c.games,function(x){return String(x.n)+'|'+String(x.p);});
    diary=mergeList(ld('hub.diary',diary),c.diary,function(x){return String(x.g)+'|'+String(x.t)+'|'+String(x.d);});
    var cs=(c.steps&&typeof c.steps==='object')?c.steps:{};
    ['mc','rb','sk','cs'].forEach(function(k){try{localStorage.setItem('hub.st3.'+k,JSON.stringify(mergeList(ld('hub.st3.'+k,[]),cs[k],function(x){return String(x.k||x.t);})));}catch(e){}});
    if(typeof c.best==='number'&&c.best>0&&(!best||c.best<best))best=c.best;
    if(typeof c.aim==='number'&&c.aim>aimBest)aimBest=c.aim;
    if(c.prof&&typeof c.prof==='object'&&c.prof.nick){['nick','st','c','av','fav'].forEach(function(k){if(c.prof[k]!=null)prof[k]=c.prof[k];});}
    try{localStorage.setItem('hub.games',JSON.stringify(games));localStorage.setItem('hub.diary',JSON.stringify(diary));
      localStorage.setItem('hub.best',JSON.stringify(best));localStorage.setItem('hub.aim',JSON.stringify(aimBest));localStorage.setItem('hub.prof',JSON.stringify(prof));}catch(e){}
    $('fnick').value=prof.nick||'';$('fst').value=prof.st||'1';$('ffav').value=prof.fav||'';
    loadSteps();syncOn=true;syncBusy=false;applyLang();rCol();cloudSave();
  }).catch(function(){syncBusy=false;rAcc();});}
function initAcc(){
  if(!FB||!FB.auth)return;
  if(FB.auth.getRedirectResult){FB.auth.getRedirectResult().then(function(r){if(r&&r.user)doSync();},loginErr);}
  if(isGoogle())doSync();
  rAcc();}
function loginErr(e){
  if(!e)return;var a=FB.auth,code=e.code||'';
  if(code==='auth/credential-already-in-use'||code==='auth/email-already-in-use'){
    var cr=e.credential||(firebase.auth.GoogleAuthProvider.credentialFromError&&firebase.auth.GoogleAuthProvider.credentialFromError(e));
    if(cr){a.signInWithCredential(cr).then(function(){location.reload();},function(){alert(t('acc_err'));});return;}}
  if(code==='auth/popup-closed-by-user'||code==='auth/cancelled-popup-request')return;
  alert(t('acc_err')+(code?' ('+code+')':''));}
function login(){
  if(!FB||!FB.auth||!FB.auth.currentUser)return;
  var p=new firebase.auth.GoogleAuthProvider();
  FB.auth.currentUser.linkWithPopup(p).then(function(){doSync();},function(e){
    var code=e&&e.code||'';
    if(code==='auth/popup-blocked'||code==='auth/operation-not-supported-in-this-environment'){FB.auth.currentUser.linkWithRedirect(p);return;}
    loginErr(e);});}
function rAcc(){
  var a=$('acc');a.innerHTML='';
  if(!FB||!FB.auth){a.appendChild(el('div','muted',t('off_srv')));return;}
  if(!isGoogle()){
    var b=el('button','mi');b.type='button';b.appendChild(el('span',null,'G'));b.appendChild(el('span',null,t('acc_login')));b.onclick=login;a.appendChild(b);
    a.appendChild(el('div','muted',t('acc_hint')));return;}
  var u=FB.auth.currentUser,box=el('div','accu');box.appendChild(el('span','pav sm',av(prof.av)));
  var x=el('div');x.appendChild(el('b',null,u.displayName||u.email||'Google'));x.appendChild(el('small',null,syncOn?'✓ '+t('acc_on'):t('acc_sync')));
  box.appendChild(x);a.appendChild(box);
  var o=el('button','mi',t('acc_out'));o.type='button';o.onclick=function(){syncOn=false;FB.auth.signOut().then(function(){location.reload();});};a.appendChild(o);}

/* Язык и стиль */
function applyLang(){
  document.documentElement.lang=lang;
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(e){e.textContent=t(e.dataset.i);});
  Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(e){e.placeholder=t(e.dataset.p);});
  $('menub').setAttribute('aria-label',t('menu'));$('dx').setAttribute('aria-label',t('menu'));
  setRx(rxk);rbest();ttLbl();aimLbl();updTitle();hdr();rBack();rGuide();rDiary();rVote();rFriends();rMine();rAv();rStat();rLb();rLfg();lfgOpts();rDm();rXo();rAcc();
}
function applyGame(k){game=k;sv('hub.game',k);document.documentElement.dataset.game=k;loadSteps();updTitle();rGuide();buildDrawer();pushProf();}

document.documentElement.dataset.game=game;
loadSteps();applyLang();setup();
})();
