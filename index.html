:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;
--bg:#2b1d12;--card:#4a3322;--ink:#f4efe2;--muted:#c9bba1;--accent:#5b8c2a;--ai:#fff;--line:#1a110a;--ok:#7bc043;--warn:#f1c232;
--fh:"Press Start 2P","Courier New",monospace;--fb:Nunito,system-ui,sans-serif;--r:0px;--hs:13px;--bw:3px;--bc:#1a110a}
:root[data-game=roblox]{--bg:#1b1d21;--card:#2a2d33;--ink:#fff;--muted:#aeb4bf;--accent:#00a2ff;--ai:#fff;--line:#3d414a;--ok:#02b757;--warn:#ffb400;--fh:"Russo One",Verdana,sans-serif;--r:8px;--hs:22px;--bw:0px;--bc:transparent}
:root[data-game=sky]{--bg:#2a2a5a;--card:rgba(255,255,255,.14);--ink:#fff7ea;--muted:#e8d9ef;--accent:#f6c667;--ai:#2b2140;--line:rgba(255,255,255,.28);--ok:#9be8c0;--warn:#ffd98a;--fh:Comfortaa,sans-serif;--r:20px;--hs:22px;--bw:0px;--bc:transparent}
:root[data-game=cs16]{--bg:#2b3226;--card:#4c5844;--ink:#f1f1e4;--muted:#b8c2a8;--accent:#ffb000;--ai:#1d2218;--line:#232a1e;--ok:#9be36a;--warn:#ffb000;--fh:Tahoma,Verdana,sans-serif;--fb:Tahoma,Verdana,sans-serif;--r:0px;--hs:20px;--bw:2px;--bc:#1d2218}
:root[data-game=csgo]{--bg:#12161c;--card:#1d232c;--ink:#e8ecf2;--muted:#8e99a8;--accent:#de9b35;--ai:#14100a;--line:#2c3541;--ok:#6fcf7a;--warn:#de9b35;--fh:Oswald,Impact,sans-serif;--r:2px;--hs:26px;--bw:0px;--bc:transparent}
:root[data-game=fortnite]{--bg:#1a1446;--card:rgba(30,24,90,.82);--ink:#fff;--muted:#cfc8ff;--accent:#fce22a;--ai:#1a1446;--line:#4b3fb3;--ok:#5cf2a1;--warn:#fce22a;--fh:"Rubik Mono One",sans-serif;--r:12px;--hs:18px;--bw:0px;--bc:transparent}
:root[data-game=valorant]{--bg:#0f1923;--card:#1b2733;--ink:#ece8e1;--muted:#8b978f;--accent:#ff4655;--ai:#fff;--line:#2c3a47;--ok:#3be3b0;--warn:#ff4655;--fh:Oswald,sans-serif;--r:0px;--hs:28px;--bw:0px;--bc:transparent}
:root[data-game=gta]{--bg:#0c0f12;--card:rgba(18,22,26,.9);--ink:#f2f2f2;--muted:#9aa3ab;--accent:#2fbf71;--ai:#04140b;--line:#2a3036;--ok:#2fbf71;--warn:#f0c040;--fh:Rubik,sans-serif;--r:4px;--hs:28px;--bw:0px;--bc:transparent}
:root[data-game=dota]{--bg:#0e0f13;--card:#191b21;--ink:#ecdfc4;--muted:#a59d8a;--accent:#b8321f;--ai:#fff3e0;--line:#5a4a2a;--ok:#7bc96f;--warn:#d8b05e;--fh:Forum,serif;--r:2px;--hs:28px;--bw:1px;--bc:#d8b05e}
:root[data-game=genshin]{--bg:#1c2541;--card:rgba(255,255,255,.1);--ink:#fdf6e3;--muted:#cbd5e1;--accent:#e9c46a;--ai:#2a2140;--line:rgba(233,196,106,.38);--ok:#9be8c0;--warn:#e9c46a;--fh:Philosopher,serif;--r:16px;--hs:26px;--bw:0px;--bc:transparent}
:root[data-game=cs2]{--bg:#0d1117;--card:rgba(28,35,46,.9);--ink:#eef3fa;--muted:#8d9bb0;--accent:#4aa3ff;--ai:#06101c;--line:#26303f;--ok:#5fdc8b;--warn:#ffb84a;--fh:"Exo 2",sans-serif;--fb:"Exo 2",sans-serif;--r:6px;--hs:24px;--bw:0px;--bc:transparent}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.5 var(--fb);min-height:100vh}
:root[data-game=minecraft] body{background-image:linear-gradient(90deg,rgba(0,0,0,.16) 50%,transparent 50%),linear-gradient(rgba(0,0,0,.16) 50%,transparent 50%);background-size:32px 32px}
:root[data-game=roblox] body{border-top:8px solid #e2231a}
:root[data-game=sky] body{background:linear-gradient(180deg,#1f2a5a,#6a4a8c 48%,#f0a27a) fixed}
:root[data-game=cs16] body{background-image:linear-gradient(rgba(0,0,0,.12) 50%,transparent 50%);background-size:100% 4px}
:root[data-game=csgo] body{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 2px,transparent 2px 14px)}
:root[data-game=fortnite] body{background:linear-gradient(180deg,#2a1b7a 0%,#3b6fe0 62%,#7fd3ff 100%) fixed}
:root[data-game=fortnite] button{font-style:italic;text-transform:uppercase;box-shadow:0 4px 0 #0d0a33}
:root[data-game=fortnite] h1,:root[data-game=fortnite] h2{text-shadow:0 3px 0 #0d0a33}
:root[data-game=fortnite] .box{border:2px solid rgba(255,255,255,.18)}
:root[data-game=valorant] body{background-image:linear-gradient(115deg,transparent 70%,rgba(255,70,85,.08) 70%)}
:root[data-game=valorant] :is(h1,h2,.ds){text-transform:uppercase;letter-spacing:2px}
:root[data-game=valorant] button{text-transform:uppercase;letter-spacing:1px;font-family:Oswald,sans-serif;font-weight:700;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%)}
:root[data-game=valorant] .box{border-top:3px solid var(--accent)}
:root[data-game=gta] body{background:linear-gradient(180deg,#141a24 0%,#2b1d3a 60%,#5a2a3a 100%) fixed}
:root[data-game=gta] :is(h1,h2){font-style:italic;font-weight:800;text-shadow:2px 2px 0 #000}
:root[data-game=gta] button{font-style:italic;text-transform:uppercase}
:root[data-game=gta] .box{border-left:4px solid var(--accent)}
:root[data-game=dota] body{background:radial-gradient(700px 420px at 50% -80px,rgba(184,50,31,.35),transparent) fixed,#0e0f13}
:root[data-game=dota] .box{border:1px solid #6b5630;box-shadow:inset 0 0 0 1px rgba(216,176,94,.15),0 6px 18px rgba(0,0,0,.5)}
:root[data-game=dota] :is(h1,h2){color:var(--warn);letter-spacing:1px}
:root[data-game=dota] button{background:linear-gradient(180deg,#c9412a,#8e2214);color:#fff3e0}
:root[data-game=dota] button.g{background:transparent;color:var(--ink)}
:root[data-game=dota] button.avb{background:transparent}
:root[data-game=dota] :is(.xog button,.rpsb button){background:rgba(0,0,0,.25);color:var(--ink)}
:root[data-game=valorant] :is(button.avb,button.sw2,.xog button,.rpsb button){clip-path:none}
:root[data-game=genshin] body{background:linear-gradient(180deg,#1c2541 0%,#3a506b 55%,#5b7db1 100%) fixed}
:root[data-game=genshin] :is(.box,.item,.live,.dr,.sh){backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
:root[data-game=genshin] .box{border:1px solid var(--line);box-shadow:0 0 18px rgba(233,196,106,.12)}
:root[data-game=genshin] h1,:root[data-game=genshin] h2{color:var(--warn)}
:root[data-game=genshin] button{border-radius:999px}
:root[data-game=cs2] body{background-image:radial-gradient(900px 420px at 50% -90px,rgba(74,163,255,.28),transparent)}
:root[data-game=cs2] :is(.box,.item,.live,.dr){backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:root[data-game=cs2] .box{border-top:2px solid var(--accent)}
:root[data-game=cs2] :is(h2,.ds){text-transform:uppercase;letter-spacing:.6px}
#bn{flex-basis:100%}
button.sw2{width:34px;height:34px;min-height:0;padding:0;border-radius:50%!important;border:3px solid transparent!important;box-shadow:none!important}
button.sw2.on{border-color:var(--ink)!important}
.msg{display:flex;margin:6px 0}.msg.me{justify-content:flex-end}
.bub{max-width:82%;padding:7px 11px 6px;border-radius:calc(var(--r)*1.5);background:rgba(0,0,0,.25);border:1px solid var(--line);line-height:1.35;overflow-wrap:anywhere}
.msg:not(.me) .bub{border-bottom-left-radius:2px}
.msg.me .bub{background:var(--accent);color:var(--ai);border-color:transparent;border-bottom-right-radius:2px}
.bn{font-weight:800;font-size:13px}
.bt{font-size:11px;opacity:.6;margin-left:10px;float:right;margin-top:6px}
.sysm{text-align:center;font-size:12px;color:var(--muted);margin:8px 0}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:10px}
h1,h2{font-family:var(--fh);font-weight:400;margin:0}
h1{flex:1;min-width:0;font-size:var(--hs);line-height:1.25;overflow-wrap:anywhere}
h2{display:flex;align-items:center;gap:10px;font-size:calc(var(--hs) - 4px);margin:16px 0 12px}
:root[data-game=roblox] h1{text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--muted)}
.box,.item,.live{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
:root[data-game=sky] :is(.box,.item,.live,.dr){backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
:root[data-game=minecraft] :is(.box,.item,.live,button:not(.mi)){border:4px solid var(--line);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.15)}
:root[data-game=roblox] .box{border-left:6px solid var(--accent)}
:root[data-game=csgo] .box{border-left:4px solid #5d79ae}
:root[data-game=cs16] :is(.box,.item,.live,button,input,select,textarea,.dr){border:2px solid;border-color:#9aa88c #1d2218 #1d2218 #9aa88c}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:800 15px var(--fb);cursor:pointer;color:var(--ai);background:var(--accent);border:var(--bw) solid var(--bc);border-radius:var(--r);padding:11px 16px;min-height:46px}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.g.on{background:var(--accent);color:var(--ai)}
:root[data-game=roblox] button{box-shadow:0 4px 0 rgba(0,0,0,.45)}
:root[data-game=csgo] :is(h1,h2,button,.ds){text-transform:uppercase;letter-spacing:.6px}
:root[data-game=csgo] button{font-family:var(--fh);font-weight:500}
:root[data-game=cs16] button{background:#4c5844;color:#ffb000}
:root[data-game=cs16] button.g{color:var(--ink)}
:root[data-game=cs16] :is(button.on,.mi.on){background:#2b3226;color:#ffb000;border-color:#1d2218 #9aa88c #9aa88c #1d2218}
.ib{width:46px;padding:0;display:grid;place-items:center;flex:none}
input,select,textarea{flex:1 1 120px;min-width:0;min-height:46px;font:600 16px var(--fb);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
:root[data-game=cs16] :is(input,select,textarea){background:#2b3226;border-color:#1d2218 #9aa88c #9aa88c #1d2218}
textarea{width:100%;min-height:90px;margin-top:8px;resize:vertical}
select option{color:#111;background:#fff}
input[type=checkbox]{flex:none;width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent)}
:is(button,input,select,textarea):focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.sec{display:none}.sec.on{display:block}
.box{padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.w{width:100%;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}.item small{display:block;color:var(--muted)}
.x{background:transparent;color:var(--muted);padding:2px 10px;min-height:36px;font-size:20px;border:0;box-shadow:none}
.pill{font-size:12px;padding:6px 12px;min-height:34px}
.muted{color:var(--muted);font-size:14px}
.big{font:800 28px var(--fb);text-align:center;margin:10px 0}
:root[data-game=minecraft] .big{font:400 15px/1.6 var(--fh)}
.pk{text-align:center;font-weight:800;font-size:18px;margin-top:10px;min-height:26px}
#rx{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:20px;font-weight:800;cursor:pointer;user-select:none;background:var(--accent);color:var(--ai);border-radius:var(--r)}
.pb{height:10px;border-radius:var(--r);background:var(--accent);margin-top:6px}
/* меню */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);overflow-y:auto;z-index:40;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));background:var(--bg);border:0;border-right:1px solid var(--line);transform:translateX(-103%);visibility:hidden;transition:transform .22s,visibility 0s .22s}
body.open .ov{opacity:1;pointer-events:auto}
body.open .dr{transform:none;visibility:visible;transition:transform .22s}
.dh{display:flex;align-items:center;justify-content:space-between;font:400 calc(var(--hs) - 3px) var(--fh)}
.ds{font:800 12px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:20px 4px 8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;margin-bottom:6px;padding:0 12px;text-align:left;font:800 16px var(--fb);background:transparent;color:var(--ink);border:1px solid var(--line)}
.mi.on{background:var(--accent);color:var(--ai)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid .mi{margin:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg .mi{margin:0;justify-content:center}
.sw{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.6)}
#mi{counter-reset:mi}
:root[data-game=cs16] #mi .mi{counter-increment:mi}
:root[data-game=cs16] #mi .mi::before{content:counter(mi) ".";color:#ffb000;min-width:1.3em}
/* профиль, лист, рекорды, XO */
.pav{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:22px;line-height:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:50%}
.pav.sm{width:34px;height:34px;font-size:18px}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:10px}.ph .pav{width:64px;height:64px;font-size:34px}.ph b{display:block;font-size:20px;overflow-wrap:anywhere}.ph small{color:var(--muted)}
.pst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stc{text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}.stc b{display:block;font-size:18px}.stc small{color:var(--muted);font-size:12px}
.avr{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
button.avb{width:40px;height:40px;min-height:0;padding:0;font-size:20px;background:transparent;border:2px solid transparent!important;box-shadow:none!important;border-radius:50%!important}
button.avb.on{border-color:var(--accent)!important;background:rgba(255,255,255,.08)}
.item.click{cursor:pointer}.item.mine{outline:2px solid var(--accent);outline-offset:-2px}
.rk{width:24px;flex:none;text-align:center;font-weight:800;color:var(--muted)}
.val{font-weight:800;white-space:nowrap}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.xog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:12px auto}
.xog button{aspect-ratio:1;min-height:0;font-size:40px;font-weight:800;padding:0;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line)}
.xog button.X{color:var(--accent)}.xog button.O{color:var(--warn)}
.xst{text-align:center;font-weight:800;font-size:18px}
.bdg{margin-left:auto;background:#e74c3c;color:#fff;border-radius:999px;font:800 12px var(--fb);padding:2px 8px}
#menub{position:relative}
#menub.has::after{content:'';position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:#e74c3c;border:2px solid var(--bg)}
.ov2{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
body.sheet .ov2{opacity:1;pointer-events:auto}
.sh{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:640px;margin:0 auto;max-height:88vh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .22s,visibility 0s .22s}
body.sheet .sh{transform:none;visibility:visible;transition:transform .22s}
.shh{display:flex;justify-content:flex-end}
.dmv{max-height:48vh;min-height:120px;overflow-y:auto;margin:8px 0;padding:4px}
.accu{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:8px}
.accu b{display:block;overflow-wrap:anywhere}.accu small{color:var(--ok)}
[hidden]{display:none!important}
.pav.img{padding:0;border:0;overflow:hidden;background:none}.pav img{width:100%;height:100%;display:block;border-radius:50%}
button.avb .pav{width:100%;height:100%;border:0;background:none}
.xpb{height:12px;border-radius:999px;background:rgba(0,0,0,.3);overflow:hidden;border:1px solid var(--line);margin-top:4px}.xpb .pb{height:100%;margin:0;border-radius:0}
.achg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ach{padding:10px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-align:center}
.ach.off{opacity:.35;filter:grayscale(1)}.ach .ai{font-size:28px;line-height:1.2}.ach b{display:block;font-size:14px}.ach small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.achr{display:flex;flex-wrap:wrap;gap:4px;font-size:22px;margin:6px 0}
.qi{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.qi:last-child{border-bottom:0}
.qi .qc{width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line);font-weight:800}
.qi.done .qc{background:var(--ok);border-color:var(--ok);color:#06140c}.qi.done .qt{text-decoration:line-through;color:var(--muted)}
.qi .qt{flex:1}.qi .qx{font-weight:800;color:var(--warn);white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);z-index:60;background:var(--accent);color:var(--ai);padding:10px 16px;border-radius:999px;font-weight:800;transition:transform .25s;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:92vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.cle{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.clh{display:flex;align-items:center;gap:14px}.clh .em{font-size:44px;width:64px;height:64px;display:grid;place-items:center;border-radius:var(--r);background:rgba(0,0,0,.25);border:1px solid var(--line)}
.clh .em.img{padding:0;overflow:hidden;border-radius:var(--r)}.clh .em img{width:100%;height:100%;display:block}
.clh b{display:block;font-size:20px}.clh small{color:var(--muted)}
.rpsb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:14px auto}
.rpsb button{aspect-ratio:1;min-height:0;font-size:40px;padding:0;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.rpsv{display:flex;justify-content:center;align-items:center;gap:18px;font-size:54px;margin:12px 0}.rpsv small{font-size:13px;display:block;text-align:center;color:var(--muted)}
/* ===== Шрифты в духе каждой игры (бесплатные похожие шрифты с кириллицей) ===== */
:root{--fhw:400}
:root[data-game=minecraft]{--fh:"Pixelify Sans","Courier New",monospace;--fb:"Pixelify Sans","Courier New",monospace;--fhw:700;--hs:28px}
:root[data-game=roblox]{--fh:Montserrat,Verdana,sans-serif;--fb:Montserrat,Verdana,sans-serif;--fhw:800}
:root[data-game=sky]{--fh:Comfortaa,sans-serif;--fb:Comfortaa,sans-serif;--fhw:700}
:root[data-game=cs16]{--fh:Tahoma,Verdana,sans-serif;--fb:Tahoma,Verdana,sans-serif;--fhw:700}
:root[data-game=csgo],:root[data-game=cs2]{--fh:"Exo 2",sans-serif;--fb:"Exo 2",sans-serif;--fhw:800}
:root[data-game=fortnite]{--fh:"Fira Sans Extra Condensed",Impact,sans-serif;--fb:"Fira Sans Extra Condensed",sans-serif;--fhw:900;--hs:30px}
:root[data-game=valorant]{--fh:Oswald,Impact,sans-serif;--fb:"Roboto Condensed",sans-serif;--fhw:700}
:root[data-game=gta]{--fh:Rubik,Impact,sans-serif;--fb:Jost,sans-serif;--fhw:900}
:root[data-game=dota]{--fh:"Cormorant SC",Georgia,serif;--fb:"Fira Sans",sans-serif;--fhw:700}
:root[data-game=genshin]{--fh:"M PLUS Rounded 1c",sans-serif;--fb:"M PLUS Rounded 1c",sans-serif;--fhw:800}
h1,h2,.dh{font-weight:var(--fhw)}
:root[data-game=minecraft] .big{font:700 26px/1.3 var(--fh)}
:root[data-game=minecraft] body{font-weight:500}
:root[data-game=fortnite] :is(h1,h2,button,.ds){text-transform:uppercase;letter-spacing:.5px}
:root[data-game=fortnite] button{font-style:normal;font-weight:900;font-size:17px}
:root[data-game=csgo] button{font-weight:600}
:root[data-game=dota] :is(h1,h2){letter-spacing:1.5px}
/* главная */
.hero{display:flex;align-items:center;gap:14px}.hero .pav{width:64px;height:64px;font-size:34px}.hero b{display:block;font-size:20px;overflow-wrap:anywhere}.hero small{color:var(--muted)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}

.qa svg.i{width:28px;height:28px}
.avrow{display:flex;gap:12px;overflow-x:auto;padding:10px 0 2px}
.avrow .op{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;cursor:pointer;width:60px;flex:none;text-align:center}
.avrow .op span:last-child{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avrow .pav{width:48px;height:48px;font-size:26px}
/* приветственный экран */
.onb{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto}

/* Сохраняемый список друзей */
var U=null,DB=null,myId=null,myFr=[],frReady=false,mineTok=0;
function initFr(){
  Promise.all([claude.use('user'),claude.use('db')]).then(function(r){
    U=r[0];DB=r[1];if(!U||!DB)return;
    return U.id().then(function(id){myId=id;if(!id)return;
      return DB.doc('data/users/'+id+'/friends').get().then(function(s){var d=s.exists?s.data():null;
        myFr=(d&&Array.isArray(d.ids))?d.ids.filter(function(x){return typeof x==='string';}).slice(0,100):[];});});
  }).catch(function(){}).then(function(){frReady=true;rMine();});
}
function saveFr(){if(DB&&myId){DB.doc('data/users/'+myId+'/friends').set({ids:myFr}).catch(function(){});}}
function rMine(){var l=$('fmine'),tok=++mineTok;
  if(!frReady)return;
  if(!U||!DB||!myId){l.innerHTML='';l.appendChild(el('div','muted',t('ff_unavail')));return;}
  if(!myFr.length){l.innerHTML='';l.appendChild(el('div','muted',t('ff_empty')));return;}
  U.profiles(myFr).then(function(ps){if(tok!==mineTok)return;l.innerHTML='';
    var peers=room?room.peers():[];
    myFr.forEach(function(id){var p=ps[id],nm=(p&&p.name)||'…';
      var pe=peers.filter(function(x){return x.kind==='viewer'&&x.by===id;})[0],pr=(pe&&pe.presence)||{};
      var r=el('div','item'),x=el('div','t');x.appendChild(el('b',null,nm));
      x.appendChild(el('small',null,pe?t('ff_online')+(typeof pr.game==='string'&&pr.game?' · '+pr.game.slice(0,20):''):t('ff_off')));
      var d=el('button','x','×');d.type='button';d.onclick=function(e){e.stopPropagation();myFr=myFr.filter(function(i){return i!==id;});saveFr();rMine();};
      r.className='item click';r.onclick=function(){showProfile(id);};
      r.appendChild(el('span','dot'+(pe?'':' off')));r.appendChild(x);r.appendChild(d);l.appendChild(r);});
  }).catch(function(){});}
$('fqb').onclick=function(){var q=$('fq').value.trim(),o=$('fqr');o.innerHTML='';if(!U||!q)return;
  U.search(q).then(function(res){res=res.filter(function(p){return !p.isMe&&myFr.indexOf(p.id)<0;}).slice(0,8);
    if(!res.length){o.appendChild(el('div','muted',t('ff_none')));return;}
    res.forEach(function(p){var r=el('div','item');r.appendChild(el('div','t',p.name||'…'));

      r.appendChild(b);o.appendChild(r);});

  [['lfg','mega'],['xo','grid'],['clan','shield'],['prog','star']].forEach(function(z){var b=el('button','g');b.type='button';b.appendChild(ico(z[1]));b.appendChild(el('span',null,t(z[0])));b.onclick=function(){show(z[0]);};qa.appendChild(b);});
  var on=$('hmon');on.innerHTML='';
  var others=room?room.peers().filter(function(p){return p.kind==='viewer'&&!p.isMe&&p.by;}):[];
  if(!others.length)on.appendChild(el('div','muted',t('h_alone')));
  others.slice(0,20).forEach(function(p){var pr=p.presence||{},o=el('div','op');o.appendChild(avNode(pr.av,'pav'));var n=el('span',null,s16(pr.nick)||'…');n.style.color=col(pr.c);o.appendChild(n);
    o.onclick=function(){showProfile(p.by);};on.appendChild(o);});
  var l=$('hmlfg');l.innerHTML='';var posts=lfg.filter(function(z){return Date.now()-tms(z.t)<3*3600000;}).slice(0,3);
  if(!posts.length)l.appendChild(el('div','muted',t('lfg_empty')));
  posts.forEach(function(z){var r=el('div','item click');r.appendChild(avNode(z.av,'pav sm'));var c=el('div','t'),b=el('b',null,s16(z.nick)||'…');b.style.color=col(z.c);c.appendChild(b);
    c.appendChild(el('small',null,String(z.text||'').slice(0,80)));r.appendChild(c);r.onclick=function(){if(FB&&z.id===FB.uid)show('lfg');else showProfile(z.id);};l.appendChild(r);});
  var cl=$('hmcl');cl.innerHTML='';
  if(!clTop.length)cl.appendChild(el('div','muted',t('cl_none')));
  clTop.slice(0,3).forEach(function(c,i){var r=el('div','item');r.appendChild(el('span','rk',['🥇','🥈','🥉'][i]));r.appendChild(embNode(c.emb,'pav sm'));
    var z=el('div','t');z.appendChild(el('b',null,'['+String(c.tag||'').slice(0,4)+'] '+String(c.name||'').slice(0,20)));z.appendChild(el('small',null,(Array.isArray(c.members)?c.members.length:0)+t('cl_members')));r.appendChild(z);cl.appendChild(r);});
  var lb=$('hmlb');lb.innerHTML='';
  if(!lbR.length)lb.appendChild(el('div','muted',t('lb_empty')));
  lbR.slice(0,3).forEach(function(z,i){var r=el('div','item click');r.appendChild(el('span','rk',['🥇','🥈','🥉'][i]));r.appendChild(avNode(z.av,'pav sm'));
    var b=el('b','t',s16(z.nick)||'…');b.style.color=col(z.c);r.appendChild(b);r.appendChild(el('span','val',z.r+t('ms')));r.onclick=function(){showProfile(z.id);};lb.appendChild(r);});
  rMe();rMeb();}
Array.prototype.forEach.call(document.querySelectorAll('[data-go]'),function(b){b.onclick=function(){show(b.dataset.go);};});
// главная обновляется вместе с данными
(function(){var w=function(f){return function(){var r=f.apply(this,arguments);rHome();return r;};};
  rLfg=w(rLfg);rClan=w(rClan);rLb=w(rLb);rProg=w(rProg);rFriends=w(rFriends);})();

/* ===== Поддержка (Telegram) ===== */
var SUPPORT_TG='M1_M0_1';
function support(){var url='https://t.me/'+SUPPORT_TG+'?text='+encodeURIComponent(t('sup_msg')+(prof.nick||''));
  var a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove();}
function rSup(){['supd','suph','supm'].forEach(function(id){var c=$(id);if(!c)return;c.innerHTML='';
  var b=el('button',id==='supd'?'mi':'w');b.type='button';if(id==='supd')b.appendChild(ico('help'));b.appendChild(el('span',null,t('sup_btn')));
  if(id!=='supd')b.style.marginTop='0';b.onclick=support;c.appendChild(b);});}

/* ===== Раздел «Профиль» ===== */
function rMe(){var h=$('mehead');h.innerHTML='';var hero=el('div','hero');hero.appendChild(avNode(prof.av,'pav','div'));
  var x=el('div');var nb=el('b',null,(prof.ct?'['+prof.ct+'] ':'')+(prof.nick||'…'));nb.style.color=col(prof.c);x.appendChild(nb);
  x.appendChild(el('small',null,t('lvl')+' '+lvl(prof.xp)+' · '+(prof.xp||0)+' XP'));hero.appendChild(x);h.appendChild(hero);
  var bar=el('div','xpb'),f=el('div','pb');f.style.width=((prof.xp||0)%100)+'%';bar.appendChild(f);h.appendChild(bar);
  var ar=achIcons(prof.ach);if(ar)h.appendChild(ar);
  var b=el('button','g w',t('me_prog'));b.type='button';b.onclick=function(){show('prog');};h.appendChild(b);}
function rMeb(){var b=$('meb');b.innerHTML='';b.appendChild(avNode(prof.av,'pav'));b.setAttribute('aria-label',t('me'));}
$('meb').onclick=function(){show('me');};

/* ===== Приветственный экран ===== */
var onbGame=game;
function rOnb(){
  if($('onb').hidden)return;
  var pics=$('wpics');pics.innerHTML='';[116,119,122,123,127].forEach(function(i){pics.appendChild(avNode(i,'pav'));});
  var wl=$('wlang');wl.innerHTML='';
  [['ru','Русский'],['en','English'],['cs','Čeština']].forEach(function(p){var b=el('button','mi'+(lang===p[0]?' on':''),p[1]);b.type='button';b.onclick=function(){lang=p[0];sv('hub.lang',lang);applyLang();};wl.appendChild(b);});
  var wa=$('wav');wa.innerHTML='';
  AVORDER.forEach(function(i){var b=el('button','avb'+(prof.av===i?' on':''));b.type='button';b.appendChild(avNode(i,'pav sm'));b.onclick=function(){prof.av=i;sv('hub.prof',prof);rOnb();};wa.appendChild(b);});
  var wg=$('wgame');wg.innerHTML='';
  Object.keys(GAMES).forEach(function(k){var b=el('button','mi'+(onbGame===k?' on':''));b.type='button';var sw=el('i','sw');sw.style.background=GAMES[k].c;b.appendChild(sw);b.appendChild(el('span',null,GAMES[k].n));
    b.onclick=function(){onbGame=k;applyGame(k);rOnb();};wg.appendChild(b);});}
function openOnb(){$('onb').hidden=false;$('wnick').value=prof.nick||'';document.body.style.overflow='hidden';rOnb();}
function closeOnb(){$('onb').hidden=true;document.body.style.overflow='';sv('hub.onb',1);}
$('wgo').onclick=function(){var n=$('wnick').value.trim().slice(0,16);if(n){prof.nick=n;$('fnick').value=n;}sv('hub.prof',prof);
  closeOnb();sv('hub.lang',lang);onStats();rAv();show('home');toast(t('w_hi')+(prof.nick||'')+'! 🎮');};
$('wlog').onclick=function(){closeOnb();sv('hub.lang',lang);show('home');login();};

/* Язык и стиль */
function applyLang(){
  document.documentElement.lang=lang;
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(e){e.textContent=t(e.dataset.i);});
  Array.prototype.forEach.call(document.querySelectorAll('[data-p]'),function(e){e.placeholder=t(e.dataset.p);});
  $('menub').setAttribute('aria-label',t('menu'));$('dx').setAttribute('aria-label',t('menu'));
  setRx(rxk);rbest();ttLbl();aimLbl();updTitle();hdr();rBack();rGuide();rDiary();rVote();rFriends();rMine();rAv();rStat();rLb();rLfg();lfgOpts();rDm();rXo();rAcc();rProg();rMg();rClan();rCle();rHome();rOnb();rSup();
}
function applyGame(k){game=k;sv('hub.game',k);document.documentElement.dataset.game=k;loadSteps();updTitle();rGuide();buildDrawer();pushProf();}

document.documentElement.dataset.game=game;
loadSteps();applyLang();setup();
if(FIRST)openOnb();
})();
