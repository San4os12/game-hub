html{scroll-padding-top:env(safe-area-inset-top,0px)}

:root[data-game=valorant] :is(button.avb,button.sw2,.xog button,.rpsb button){clip-path:none}
:root[data-game=genshin] body{background:linear-gradient(180deg,#1c2541 0%,#3a506b 55%,#5b7db1 100%) fixed}

:root[data-game=genshin] button{border-radius:999px}
:root[data-game=cs2] body{background-image:radial-gradient(900px 420px at 50% -90px,rgba(74,163,255,.28),transparent)}
:root[data-game=cs2] :is(.box,.item,.live,.dr){backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:root[data-game=cs2] .box{border-top:2px solid var(--accent)}
:root[data-game=cs2] :is(h2,.ds){text-transform:uppercase;letter-spacing:.6px}
#bn{flex-basis:100%}
button.sw2{width:34px;height:34px;min-height:0;padding:0;border-radius:50%!important;border:3px solid transparent!important;box-shadow:none!important}
button.sw2.on{border-color:var(--ink)!important}
.msg{display:flex;margin:6px 0}.msg.me{justify-content:flex-end}
.bub{max-width:82%;padding:7px 11px 6px;border-radius:calc(var(--r)*1.5);background:rgba(0,0,0,.25);border:1px solid var(--line);line-height:1.35;overflow-wrap:anywhere}
.msg:not(.me) .bub{border-bottom-left-radius:2px}
.msg.me .bub{background:var(--accent);color:var(--ai);border-color:transparent;border-bottom-right-radius:2px}
.bn{font-weight:800;font-size:13px}
.bt{font-size:11px;opacity:.6;margin-left:10px;float:right;margin-top:6px}
.sysm{text-align:center;font-size:12px;color:var(--muted);margin:8px 0}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 40px}
.top{display:flex;align-items:center;gap:10px}
h1,h2{font-family:var(--fh);font-weight:400;margin:0}
h1{flex:1;min-width:0;font-size:var(--hs);line-height:1.25;overflow-wrap:anywhere}
h2{display:flex;align-items:center;gap:10px;font-size:calc(var(--hs) - 4px);margin:16px 0 12px}
:root[data-game=roblox] h1{text-transform:uppercase}
.live{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}.dot.off{background:var(--muted)}
.box,.item,.live{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
:root[data-game=sky] :is(.box,.item,.live,.dr){backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
:root[data-game=minecraft] :is(.box,.item,.live,button:not(.mi)){border:4px solid var(--line);box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.15)}
:root[data-game=roblox] .box{border-left:6px solid var(--accent)}
:root[data-game=csgo] .box{border-left:4px solid #5d79ae}
:root[data-game=cs16] :is(.box,.item,.live,button,input,select,textarea,.dr){border:2px solid;border-color:#9aa88c #1d2218 #1d2218 #9aa88c}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:800 15px var(--fb);cursor:pointer;color:var(--ai);background:var(--btnbg,var(--accent));border:var(--bw) solid var(--bc);border-radius:var(--r);padding:11px 16px;min-height:46px}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.g.on{background:var(--btnbg,var(--accent));color:var(--ai)}
:root[data-game=roblox] button{box-shadow:0 4px 0 rgba(0,0,0,.45)}
:root[data-game=csgo] :is(h1,h2,button,.ds){text-transform:uppercase;letter-spacing:.6px}
:root[data-game=csgo] button{font-family:var(--fh);font-weight:500}
:root[data-game=cs16] button{background:#4c5844;color:#ffb000}
:root[data-game=cs16] button.g{color:var(--ink)}
:root[data-game=cs16] :is(button.on,.mi.on){background:#2b3226;color:#ffb000;border-color:#1d2218 #9aa88c #9aa88c #1d2218}
.ib{width:46px;padding:0;display:grid;place-items:center;flex:none}
input,select,textarea{flex:1 1 120px;min-width:0;min-height:46px;font:600 16px var(--fb);color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
:root[data-game=cs16] :is(input,select,textarea){background:#2b3226;border-color:#1d2218 #9aa88c #9aa88c #1d2218}
textarea{width:100%;min-height:90px;margin-top:8px;resize:vertical}
select option{color:#111;background:#fff}
input[type=checkbox]{flex:none;width:22px;height:22px;min-height:0;padding:0;accent-color:var(--accent)}
:is(button,input,select,textarea):focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.sec{display:none}.sec.on{display:block}
.box{padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.w{width:100%;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:8px}
.item .t{flex:1;min-width:0;overflow-wrap:anywhere}.item small{display:block;color:var(--muted)}
.x{background:transparent;color:var(--muted);padding:2px 10px;min-height:36px;font-size:20px;border:0;box-shadow:none}
.pill{font-size:12px;padding:6px 12px;min-height:34px}
.muted{color:var(--muted);font-size:14px}
.big{font:800 28px var(--fb);text-align:center;margin:10px 0}
:root[data-game=minecraft] .big{font:400 15px/1.6 var(--fh)}
.pk{text-align:center;font-weight:800;font-size:18px;margin-top:10px;min-height:26px}
#rx{height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:20px;font-weight:800;cursor:pointer;user-select:none;background:var(--accent);color:var(--ai);border-radius:var(--r)}
.pb{height:10px;border-radius:var(--r);background:var(--accent);margin-top:6px}
/* меню */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.dr{position:fixed;top:0;bottom:0;left:0;width:min(86vw,320px);overflow-y:auto;z-index:40;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));background:var(--bg);border:0;border-right:1px solid var(--line);transform:translateX(-103%);visibility:hidden;transition:transform .22s,visibility 0s .22s}
body.open .ov{opacity:1;pointer-events:auto}
body.open .dr{transform:none;visibility:visible;transition:transform .22s}
.dh{display:flex;align-items:center;justify-content:space-between;font:400 calc(var(--hs) - 3px) var(--fh)}
.ds{font:800 12px var(--fb);color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:20px 4px 8px}
.mi{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;margin-bottom:6px;padding:0 12px;text-align:left;font:800 16px var(--fb);background:transparent;color:var(--ink);border:1px solid var(--line)}
.mi.on{background:var(--accent);color:var(--ai)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.grid .mi{margin:0;min-width:0;padding:0 8px;gap:7px;font-size:13px;min-height:46px}.grid .mi .sw{width:11px;height:11px}.grid .mi span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grid .mi .sw{flex:none}.dr{overflow-x:hidden}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.seg .mi{margin:0;justify-content:center}
.sw{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid rgba(255,255,255,.6)}
#mi{counter-reset:mi}
:root[data-game=cs16] #mi .mi{counter-increment:mi}
:root[data-game=cs16] #mi .mi::before{content:counter(mi) ".";color:#ffb000;min-width:1.3em}
/* профиль, лист, рекорды, XO */
.pav{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:22px;line-height:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:50%}

.stc{text-align:center;padding:10px 4px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}.stc b{display:block;font-size:18px}.stc small{color:var(--muted);font-size:12px}
.avr{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}

.item.click{cursor:pointer}.item.mine{outline:2px solid var(--accent);outline-offset:-2px}
.rk{width:24px;flex:none;text-align:center;font-weight:800;color:var(--muted)}
.val{font-weight:800;white-space:nowrap}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.xog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:12px auto}
.xog button{aspect-ratio:1;min-height:0;font-size:40px;font-weight:800;padding:0;background:rgba(0,0,0,.25);color:var(--ink);border:1px solid var(--line)}
.xog button.X{color:var(--accent)}.xog button.O{color:var(--warn)}
.xst{text-align:center;font-weight:800;font-size:18px}
.bdg{margin-left:auto;background:#e74c3c;color:#fff;border-radius:999px;font:800 12px var(--fb);padding:2px 8px}
#menub{position:relative}
#menub.has::after{content:'';position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:#e74c3c;border:2px solid var(--bg)}

:root[data-game=fortnite]{--fh:"Fira Sans Extra Condensed",Impact,sans-serif;--fb:"Fira Sans Extra Condensed",sans-serif;--fhw:900;--hs:30px}

h1,h2,.dh{font-weight:var(--fhw)}

/* ================= Полировка дизайна ================= */
:root{--gap:12px}
body{-webkit-tap-highlight-color:transparent;text-rendering:optimizeLegibility}

.top{position:sticky;top:0;z-index:15;margin:-12px -14px 12px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;gap:8px;
  background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}

:root{padding-top:0}

.mebtn{margin:0 0 0 2px;width:40px;height:40px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);

  background:transparent!important;color:var(--muted)!important;border:0!important;box-shadow:none!important;clip-path:none!important;font:700 11px var(--fb)!important;text-transform:none!important;letter-spacing:0!important}

.tab.on{color:var(--ink)!important}

.tab .tlb{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.onb:not([hidden])~.tabbar{display:none}

.mg{font:700 13px var(--fb);color:var(--muted);margin:18px 6px 8px;text-transform:none;letter-spacing:0}
.mg:first-child{margin-top:6px}
.ds[data-i=m_sec]{display:none}
.ds{text-transform:none;letter-spacing:.2px;font-size:13px}
/* карточки и списки */
.box{padding:16px;margin-bottom:var(--gap)}
.box>b:first-child{font-size:17px}
.item{min-height:56px}
.item.click:not(:has(button))::after{content:'';flex:none;width:8px;height:8px;margin:0 4px 0 2px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);opacity:.7}

/* отклик на нажатие и фокус */
button{transition:filter .15s,transform .08s,background-color .15s}

:is(button,input,select,textarea,.item.click):focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* ===== Карточка награды XP ===== */
.rw{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:61;width:min(92vw,420px);
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;cursor:pointer;
  background:var(--card);background:color-mix(in srgb,var(--bg) 70%,var(--accent) 30%);border:2px solid var(--accent);
  box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  transform:translate(-50%,calc(100% + 120px));opacity:0;transition:transform .35s cubic-bezier(.2,1.3,.4,1),opacity .2s;pointer-events:none}
.rw.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.rwi{flex:none;width:56px;height:56px;display:grid;place-items:center;font-size:32px;border-radius:16px;background:rgba(0,0,0,.25)}
.rwb{flex:1;min-width:0}
.rwn{font:900 30px/1 var(--fh);color:var(--warn);letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.rwt{font-weight:800;font-size:15px;margin-top:4px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rws{font-size:12px;color:var(--muted)}
.rwbar{height:10px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;margin-top:8px}
.rwbar i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--warn));transition:width .9s cubic-bezier(.3,.8,.3,1)}
.rwl{font-size:12px;color:var(--muted);margin-top:4px}
.rw.lvl{border-color:var(--warn);box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 0 6px color-mix(in srgb,var(--warn) 30%,transparent),0 0 40px color-mix(in srgb,var(--warn) 45%,transparent)}
.rw.lvl .rwi{animation:rwPop .6s ease-out 2}
@keyframes rwPop{50%{transform:scale(1.25) rotate(-6deg)}}
body.chatopen .rw,body.sheet .rw{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:1024px){.rw{left:auto;right:28px;bottom:28px;transform:translate(0,calc(100% + 60px))}.rw.on{transform:none}}
/* ===== Правила ===== */
.rulc{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:14px;line-height:1.4;cursor:pointer}
.rulc input{margin-top:1px}
.rulc a{color:var(--accent)}
/* ===== Баннеры профиля ===== */
.pcard{position:relative;margin:-16px -16px 12px;border-radius:var(--r) var(--r) 0 0;overflow:hidden}
.sh .pcard{margin:-4px 0 12px;border-radius:16px}
.pban{height:96px;background:var(--accent)}
.pcard .ph{position:relative;margin:-36px 16px 0;align-items:flex-end}
.pcard .ph .pav{width:76px;height:76px;font-size:40px;border:4px solid var(--card);background:var(--card)}
.pcard .ph>div:last-child{padding-bottom:4px;min-width:0}
.pcard .ph b{text-shadow:0 1px 0 rgba(0,0,0,.25)}
.bng{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bng button{position:relative;height:56px;padding:0;border-radius:12px!important;border:3px solid transparent!important;box-shadow:none!important;clip-path:none!important;overflow:hidden}
.bng button.on{border-color:var(--ink)!important}
.bng button .lk,.frg button .lk{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font:800 12px var(--fb)}
.frg{display:flex;flex-wrap:wrap;gap:10px}
.frg button{position:relative;width:62px;height:62px;padding:0;border-radius:50%!important;background:transparent!important;border:2px solid transparent!important;box-shadow:none!important;clip-path:none!important;overflow:visible}
.frg button.on{border-color:var(--ink)!important}
.frg button .pav{width:100%;height:100%}
.frg button .lk{border-radius:50%}
/* рамки аватарок */
.pav.fr1{box-shadow:0 0 0 3px #cd7f32,0 0 0 5px rgba(0,0,0,.35)}
.pav.fr2{box-shadow:0 0 0 3px #c0c0c0,0 0 10px #c0c0c0}
.pav.fr3{box-shadow:0 0 0 3px #f5c542,0 0 14px #f5c542}
.pav.fr4{box-shadow:0 0 0 3px #7ff3ff,0 0 0 6px #b77bff,0 0 18px #7ff3ff}
.pav.fr5{box-shadow:0 0 0 3px #ff6a00,0 0 16px #ff2d00}
.pav.fr6{box-shadow:0 0 0 3px #39ff14,0 0 14px #39ff14}
/* жалобы, баны, модерация */
.banbar{margin:0 12px 8px;padding:10px 12px;border-radius:12px;background:#7a1f1f;color:#fff;font-size:13px;font-weight:700}
.rsn{display:grid;gap:8px;margin-top:10px}
.rsn button{text-align:left;justify-content:flex-start}
.mdi{padding:12px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:rgba(0,0,0,.18)}
.mdi .mdt{font-weight:800}
.mdi .mdq{margin:6px 0;padding:8px 10px;border-left:3px solid var(--warn);background:rgba(0,0,0,.25);border-radius:8px;overflow-wrap:anywhere;white-space:pre-wrap}
.mdi .row button{flex:1 1 auto;min-height:38px;font-size:13px;padding:6px 10px}
.danger2{background:#c0392b!important;color:#fff!important}
.tabs3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 4px}
.tabs3 button{min-height:38px;font-size:13px;padding:6px}
.lbtabs3{grid-template-columns:repeat(3,1fr)!important}
.uid{font:600 12px ui-monospace,monospace;word-break:break-all;color:var(--muted);margin-top:6px}

:root[data-game=neon]{--bg:#070812;--card:#0e1120;--ink:#eef0ff;--muted:#8b90b0;--accent:#22e584;--ai:#03140a;--line:#1f2442;--ok:#22e584;--warn:#b26bff;--fh:"Exo 2",sans-serif;--fb:"Exo 2",sans-serif;--r:14px;--hs:24px;--bw:0px;--bc:transparent}
:root[data-game=cyber]{--bg:#0a0a0c;--card:#141418;--ink:#f4f4f4;--muted:#9a9aa5;--accent:#fcee0a;--ai:#0a0a0c;--line:#2a2a33;--ok:#00f0ff;--warn:#ff003c;--fh:"Russo One",sans-serif;--r:0px;--hs:24px;--bw:0px;--bc:transparent}
:root[data-game=synth]{--bg:#1a0b2e;--card:rgba(36,14,66,.86);--ink:#fff1fb;--muted:#d3a8e8;--accent:#ff3df2;--ai:#22042e;--line:#4b1f7a;--ok:#3ff2ff;--warn:#ffb84d;--fh:"Rubik Mono One",sans-serif;--r:10px;--hs:18px;--bw:0px;--bc:transparent}
:root[data-game=sakura]{--bg:#1f1420;--card:#2d1d2e;--ink:#fff0f5;--muted:#d9b3c6;--accent:#ff8fb8;--ai:#2a0f1c;--line:#4a2f45;--ok:#9be8c0;--warn:#ffd1e0;--fh:Comfortaa,sans-serif;--r:20px;--hs:22px;--bw:0px;--bc:transparent}
:root[data-game=ocean]{--bg:#03141f;--card:rgba(6,40,58,.86);--ink:#e6fbff;--muted:#8fc3d1;--accent:#1fd1c1;--ai:#032026;--line:#0e4257;--ok:#5ef2b0;--warn:#ffc857;--fh:Montserrat,sans-serif;--r:16px;--hs:22px;--bw:0px;--bc:transparent}
:root[data-game=blood]{--bg:#0d0405;--card:#1a0a0c;--ink:#f6e7e7;--muted:#b08a8d;--accent:#e01e37;--ai:#fff;--line:#3a1216;--ok:#ff6b6b;--warn:#ffb703;--fh:Philosopher,serif;--r:6px;--hs:26px;--bw:0px;--bc:transparent}
:root[data-game=matrix]{--bg:#000;--card:#03110a;--ink:#b9ffcf;--muted:#4fae6e;--accent:#00ff66;--ai:#001a0a;--line:#0a3a1d;--ok:#00ff66;--warn:#d4ff00;--fh:"Pixelify Sans",monospace;--r:2px;--hs:22px;--bw:0px;--bc:transparent}
:root[data-game=frost]{--bg:#0b1724;--card:rgba(220,240,255,.08);--ink:#f0f8ff;--muted:#a9c4dc;--accent:#8fd3ff;--ai:#06202f;--line:rgba(173,216,255,.25);--ok:#7dffcf;--warn:#ffe08a;--fh:Jost,sans-serif;--r:18px;--hs:24px;--bw:0px;--bc:transparent}
:root[data-game=royal]{--bg:#0a0a0a;--card:#15130f;--ink:#f7f0dc;--muted:#b3a88a;--accent:#d4af37;--ai:#1a1405;--line:#3a3220;--ok:#9fd38b;--warn:#d4af37;--fh:"Cormorant SC",serif;--r:4px;--hs:28px;--bw:0px;--bc:transparent}
:root[data-game=vapor]{--bg:#2b1b4a;--card:rgba(43,27,74,.72);--ink:#fff;--muted:#e0d0ff;--accent:#7ef9ff;--ai:#2b1b4a;--line:rgba(255,255,255,.25);--ok:#a5ffd6;--warn:#ff9ff3;--fh:"M PLUS Rounded 1c",sans-serif;--r:14px;--hs:22px;--bw:0px;--bc:transparent}
:root[data-game=neon] body{background:radial-gradient(900px 520px at 90% -10%,rgba(168,85,247,.20),transparent) fixed,radial-gradient(700px 420px at -10% 110%,rgba(34,229,132,.10),transparent) fixed,#070812}
:root[data-game=neon] :is(h1,h2,.bh b,.pro-n){font-style:italic;font-weight:800}
:root[data-game=neon] .box{box-shadow:0 0 0 1px rgba(168,85,247,.07),0 12px 30px rgba(0,0,0,.35)}
:root[data-game=neon] .mi{font-style:italic;font-weight:800;text-transform:uppercase}
:root[data-game=neon] .mi.on{background:linear-gradient(90deg,#16a34a,#22e584);color:#03140a;box-shadow:0 0 18px rgba(34,229,132,.35)}
:root[data-game=neon] .hexl{background:linear-gradient(#c084fc,#7c3aed)}
:root[data-game=cyber] body{background:repeating-linear-gradient(0deg,rgba(0,240,255,.035) 0 1px,transparent 1px 3px),linear-gradient(160deg,#0a0a0c 60%,#1c1a00) fixed}
:root[data-game=cyber] .box{border-left:3px solid var(--accent)}
:root[data-game=cyber] :is(h1,h2,.bh b){text-transform:uppercase;letter-spacing:1px;text-shadow:2px 0 var(--warn),-2px 0 var(--ok)}
:root[data-game=cyber] button:not(.mi):not(.avb):not(.pill):not(.sw2){clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
:root[data-game=cyber] :is(.xog button,.rpsb button,.bng button,.frg button,.bed-th button){clip-path:none}:root[data-game=cyber] button.hex{clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
:root[data-game=synth] body{background:linear-gradient(180deg,#1a0b2e 0%,#3a0d5c 55%,#ff3d8b 140%) fixed}
:root[data-game=synth] :is(h1,h2){text-shadow:0 0 14px #ff3df2}
:root[data-game=synth] .box{box-shadow:0 0 0 1px rgba(255,61,242,.25),0 0 24px rgba(255,61,242,.12)}
:root[data-game=sakura] body{background:radial-gradient(800px 500px at 100% 0,rgba(255,143,184,.18),transparent) fixed,#1f1420}
:root[data-game=sakura] button{border-radius:999px}
:root[data-game=ocean] body{background:linear-gradient(180deg,#03141f,#053049 60%,#0a5a6e) fixed}
:root[data-game=ocean] :is(.box,.item,.live,.dr){backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
:root[data-game=blood] body{background:radial-gradient(700px 420px at 50% -120px,rgba(224,30,55,.35),transparent) fixed,#0d0405}
:root[data-game=blood] :is(h1,h2){color:#ff4d5e;letter-spacing:1px}
:root[data-game=blood] .box{border-color:#4a141a;box-shadow:0 8px 24px rgba(0,0,0,.6)}
:root[data-game=matrix] body{background:repeating-linear-gradient(90deg,rgba(0,255,102,.05) 0 1px,transparent 1px 16px),#000}
:root[data-game=matrix] :is(h1,h2,.pro-n){text-shadow:0 0 10px rgba(0,255,102,.7)}
:root[data-game=frost] body{background:linear-gradient(180deg,#0b1724,#1d3c5a 70%,#2d5f86) fixed}
:root[data-game=frost] :is(.box,.item,.live,.dr,.sh){backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
:root[data-game=royal] body{background:radial-gradient(800px 400px at 50% -100px,rgba(212,175,55,.16),transparent) fixed,#0a0a0a}
:root[data-game=royal] .box{border-color:#4a3d1c;box-shadow:inset 0 0 0 1px rgba(212,175,55,.08)}
:root[data-game=royal] :is(h1,h2,.bh b){color:var(--accent);letter-spacing:1px}
:root[data-game=vapor] body{background:linear-gradient(180deg,#ff71ce 0%,#b967ff 45%,#01cdfe 100%) fixed}
:root[data-game=vapor] :is(.box,.item,.live,.dr,.sh){backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.grid>.mg{grid-column:1/-1;margin:10px 4px 2px}
/* ===== Новый профиль ===== */
#mehead{margin-bottom:14px}
.pro{position:relative;background:var(--card);border:1px solid var(--line);border-radius:max(var(--r),4px);overflow:hidden}
.pro-ban{position:relative;height:clamp(130px,24vw,230px);background-size:cover!important;background-position:center!important}
.pro-ban::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 35%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
.pro-eb{position:absolute;top:12px;right:12px;z-index:2;display:inline-flex;gap:8px;align-items:center;min-height:40px;padding:6px 14px;font:700 13px var(--fb);background:rgba(8,10,20,.62)!important;color:#fff!important;border:1px solid rgba(255,255,255,.35)!important;border-radius:12px!important;box-shadow:none!important;clip-path:none!important;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pro-eb .i{width:18px;height:18px}
.pro-main{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;padding:0 20px;margin-top:-58px}
.pro-av{position:relative;flex:none}
.pro-av .pav{width:124px;height:124px;font-size:64px;border:4px solid var(--card);background:var(--card)}
.pro-av .pav:not([class*=fr]){box-shadow:0 0 0 3px var(--ok),0 0 24px color-mix(in srgb,var(--ok) 55%,transparent)}
.pro-dot{position:absolute;right:9px;bottom:9px;width:20px;height:20px;border-radius:50%;background:var(--ok);border:3px solid var(--card)}
.pro-dot.off{background:#6b7280}.pro-av.off .pav:not([class*=fr]){box-shadow:0 0 0 3px #4b5563}.pro-dot.busy{background:#f59e0b}
.pro-id{flex:1 1 220px;min-width:0;padding-bottom:4px}
.pro-n{font:800 clamp(22px,3.2vw,32px)/1.15 var(--fh);overflow-wrap:anywhere}
.pro-l{color:var(--ink);opacity:.85;margin-top:4px;font-size:15px}
.pro-s{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;font-size:14px;color:var(--muted)}
.pro-s .on{color:var(--ok);font-weight:700}.pro-s .on::before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px}
.pro-stats{flex:0 1 400px;display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:max(var(--r),4px);background:rgba(0,0,0,.2);margin-bottom:4px}
.pro-st{display:flex;align-items:center;gap:10px;padding:12px 14px;min-width:0}
.pro-st+.pro-st{border-left:1px solid var(--line)}
.pro-st .i{width:26px;height:26px;flex:none;color:var(--ok)}
.pro-st small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pro-st b{font-size:19px}
.pro-bio{margin:12px 20px 0;color:var(--ink);opacity:.9;overflow-wrap:anywhere}
.pro-lv{display:flex;align-items:center;gap:14px;margin:16px 20px 20px;padding:12px 16px;border:1px solid var(--line);border-radius:max(var(--r),4px);background:rgba(0,0,0,.2)}
.pro-lv .lbl{color:var(--warn);font-weight:700}
.pro-lv .xpb{flex:1;margin:0;height:10px;border:0;background:rgba(255,255,255,.08)}
.pro-lv .xpb .pb{background:linear-gradient(90deg,var(--ok),color-mix(in srgb,var(--ok) 60%,#fff))}
.pro-lv>b{white-space:nowrap;font-size:13px}
.hexl{flex:none;width:34px;height:38px;display:grid;place-items:center;font-weight:800;color:#fff;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(var(--warn),color-mix(in srgb,var(--warn) 55%,#000))}
.megrid{display:grid;gap:14px;align-items:start;margin-bottom:14px}
@media(min-width:900px){.merest{columns:2;column-gap:18px}.merest>.box{break-inside:avoid}}
.megrid>.box{margin:0;min-width:0}
@media(min-width:1000px){.megrid{grid-template-columns:1fr 1fr}.megrid>.mewide{grid-column:1/-1}}
.bh{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.bh>.i{width:26px;height:26px;flex:none}
.bh>b{flex:1;min-width:0;font:800 20px var(--fh)}
.bh .eb{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;min-width:40px;padding:6px 12px;font-size:13px}
.bh .eb .i{width:18px;height:18px}
.pro-about{font-size:16px;line-height:1.5;overflow-wrap:anywhere;white-space:pre-wrap}
.pro-sub{margin-top:10px;color:var(--muted);font-size:14px}
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gcard{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid color-mix(in srgb,var(--gc) 55%,transparent);border-radius:max(var(--r),4px);background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 16%,transparent),transparent);min-width:0}
.gcard .gi{flex:none;width:52px;height:52px;display:grid;place-items:center;font-size:28px;border-radius:12px;background:color-mix(in srgb,var(--gc) 35%,#000)}
.gcard div{min-width:0}.gcard b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard small{color:var(--muted);font-size:12px}.gcard small::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px}
.hexr{display:flex;flex-wrap:wrap;gap:12px}
.hex{padding:0!important;border:0!important;box-shadow:none!important;min-height:0!important;min-width:0!important;margin:0!important;border-radius:0!important;background:linear-gradient(160deg,var(--hc),color-mix(in srgb,var(--hc) 40%,#000))!important;width:60px;height:68px;display:grid;place-items:center;cursor:pointer;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--hc),color-mix(in srgb,var(--hc) 40%,#000));filter:drop-shadow(0 0 8px color-mix(in srgb,var(--hc) 60%,transparent))}
.hex span{width:50px;height:57px;display:grid;place-items:center;font-size:24px;clip-path:inherit;background:linear-gradient(160deg,color-mix(in srgb,var(--hc) 30%,#0b0d18),#0b0d18)}
.hex.lk{filter:grayscale(1);opacity:.35}
.sh .pro{margin:-2px 0 12px}
.sh .pro-av .pav{width:96px;height:96px;font-size:50px}
.sh .pro-main{margin-top:-46px;padding:0 14px}
.sh .pro-lv{margin:12px 14px 14px}
.sh .pro-stats{flex:1 1 100%}
.bnup{display:grid;place-items:center;background:rgba(0,0,0,.35)!important}
/* редактор баннера */
.bed-pv{position:relative;aspect-ratio:4/1;margin:12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--line);background-size:cover!important;background-position:center!important}
.bed-pv canvas{display:block;width:100%;height:100%;cursor:grab}
.bed-pv canvas:active{cursor:grabbing}
.bed-th{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.bed-th button{position:relative;flex:none;width:92px;height:46px;padding:0;border-radius:10px!important;border:3px solid transparent!important;box-shadow:none!important;background-size:cover!important;background-position:center!important;overflow:hidden}
.bed-th button.on{border-color:var(--ok)!important}
.bed-th .lk{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;font:800 12px var(--fb)}
.bed-z{display:flex;align-items:center;gap:10px;margin:10px 0 4px}.bed-z input{flex:1}
.bed-o{display:grid;gap:8px;margin:12px 0}
.bed-b{display:flex!important;align-items:center;gap:14px;text-align:left;justify-content:flex-start;min-height:60px;padding:10px 14px}
.bed-b .i{width:26px;height:26px;flex:none}.bed-b b{display:block}.bed-b small{color:var(--muted);font-weight:500}
.bed-err{color:#ff6b6b;font-weight:700;margin:6px 0}
.bio-ta{width:100%;min-height:96px;margin:10px 0;resize:vertical}
@media(max-width:640px){
  .pro-main{margin-top:-50px;padding:0 14px;gap:10px 14px}
  .pro-av .pav{width:100px;height:100px;font-size:52px}
  .pro-dot{right:6px;bottom:6px}
  .pro-id{flex:1 1 150px}
  .pro-stats{flex:1 1 100%}
  .pro-st{padding:10px 8px;gap:7px}.pro-st .i{width:22px;height:22px}.pro-st b{font-size:17px}
  .pro-lv{margin:12px 14px 14px;padding:10px 12px;gap:10px}

/* ===== Достижения: редкость и прогресс ===== */
.achh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.achc{font:800 12px var(--fb);letter-spacing:.5px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:rgba(0,0,0,.25)}
.achbar{height:6px;margin-top:10px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.achbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,#cd7f32,#c9d1d9,#f5c542,#c77dff);transition:width 1s var(--ez)}
.achlg{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12px;color:var(--muted)}
.alg{display:inline-flex;align-items:center;gap:6px}.alg i{width:10px;height:10px;border-radius:50%;background:var(--rc);box-shadow:0 0 6px var(--rc)}
.ach{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px!important;border-color:color-mix(in srgb,var(--rc) 45%,var(--line))!important;
  background:radial-gradient(120px 90px at 50% 20%,color-mix(in srgb,var(--rc) 16%,transparent),transparent 70%),var(--card)!important}

.ach .amd{width:58px;height:58px;display:grid;place-items:center;margin:6px 0 2px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 55%,#fff) 0,var(--rc) 35%,color-mix(in srgb,var(--rc) 45%,#000) 100%);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--rc) 35%,#000),0 0 0 5px color-mix(in srgb,var(--rc) 70%,transparent),0 6px 16px -4px #000}
.ach .amd .ai{font-size:28px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.ach.r3 .amd{animation:legGlow 2.4s ease-in-out infinite alternate}
@keyframes legGlow{from{box-shadow:0 0 0 3px #3b1460,0 0 0 5px rgba(199,125,255,.7),0 0 6px rgba(199,125,255,.4)}to{box-shadow:0 0 0 3px #3b1460,0 0 0 5px rgba(199,125,255,.9),0 0 22px rgba(199,125,255,.9)}}

.ach.off{opacity:1!important;filter:none!important}

.hex.r3:not(.lk){animation:legHex 2.4s ease-in-out infinite alternate}

.playing{color:var(--ok)!important;font-weight:700}

/* ===== Стиль Minimal ===== */
:root[data-game=min]{
  --bg:#0D0F14;--card:#151821;--card-hover:#1B1F2A;--border:rgba(255,255,255,.06);--text:#F2F3F5;--text-muted:#8A8F9C;
  --accent:#E8323F;--accent-hover:#FF4452;--radius:16px;--radius-sm:12px;
  --ink:var(--text);--muted:var(--text-muted);--line:var(--border);--ai:#fff;--ok:#3BAF73;--warn:#F2F3F5;--glow:rgba(232,50,63,.22);
  --fh:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--fb:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--fhw:600;
  --r:16px;--hs:22px;--bw:0px;--bc:transparent;--btnbg:var(--accent);--btnsh:none;--gap:12px}
:root[data-game=min] body{background:var(--bg);color:var(--text);font:400 15px/1.5 var(--fb);letter-spacing:0}
:root[data-game=min] body::before,:root[data-game=min] body::after{display:none}
:root[data-game=min] .wrap{padding-left:16px;padding-right:16px}
:root[data-game=min] .top{margin-left:-16px;margin-right:-16px;padding-left:12px;padding-right:12px;background:color-mix(in srgb,var(--bg) 92%,transparent)}
:root[data-game=min] :is(h1,h2,.dh){font-family:var(--fb);font-weight:600;text-shadow:none;letter-spacing:0;text-transform:none;color:var(--text)}
:root[data-game=min] #cur{font-size:22px;font-weight:600}
:root[data-game=min] #cur svg.i{color:var(--accent)}
:root[data-game=min] svg.i{stroke-width:1.75}
:root[data-game=min] b,:root[data-game=min] strong{font-weight:600}
:root[data-game=min] .muted{font-size:13px;color:var(--muted)}
:root[data-game=min] small{font-weight:400}
/* карточки */
:root[data-game=min] .box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:12px;box-shadow:none}
:root[data-game=min] .box::before,:root[data-game=min] .box::after{display:none}
:root[data-game=min] .box>b:first-child,:root[data-game=min] .bh b{font-size:17px;font-weight:600;font-family:var(--fb)}
:root[data-game=min] .bh svg.i{color:var(--text-muted)}
:root[data-game=min] :is(.item,.accu,.stc,.ach,.mdi,.nwi){background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:none}
:root[data-game=min] .sec .box .item{background:var(--card-hover);border-color:transparent}
:root[data-game=min] .item.click:hover,:root[data-game=min] .op:hover{outline:0;background:var(--card-hover)}
:root[data-game=min] .empty{background:transparent;border:1px dashed rgba(255,255,255,.1);border-radius:12px;color:var(--muted)}
:root[data-game=min] .empty .ei{animation:none}
/* кнопки */
:root[data-game=min] button{font:600 15px var(--fb);border-radius:14px;box-shadow:none;text-shadow:none;text-transform:none;letter-spacing:0;font-style:normal;clip-path:none;background:var(--accent);color:#fff;border:0}
:root[data-game=min] button:not(.g):not(.x):not(.tab):not(.mi):not(.bellb):not(.btrow):not(.mebtn):not(.avb):not(.sw2):not(.hex):not(:disabled):hover{background:var(--accent-hover);filter:none}
:root[data-game=min] button.g{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.12)}
:root[data-game=min] button.g:hover{background:rgba(255,255,255,.04);filter:none}
:root[data-game=min] button.g.on{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-game=min] button.x{background:transparent;color:var(--muted)}

:root[data-game=min] button.w.g{min-height:48px}

:root[data-game=min] .btnlink.w:not(.g){background:var(--accent);border-color:var(--accent);color:#fff;min-height:56px;font-size:17px}
:root[data-game=min] .pill{min-height:34px;border-radius:999px;font:600 13px var(--fb)}

:root[data-game=min] :is(input,select,textarea):focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
:root[data-game=min] :is(button,input,select,textarea,.item.click):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
:root[data-game=min] .chip{background:var(--card-hover);border:0;border-radius:8px;font:500 13px var(--fb);color:var(--text)}
:root[data-game=min] .hchip{background:var(--card-hover);font-weight:500}
:root[data-game=min] .bdg{background:var(--accent);color:#fff;font:600 11px var(--fb)}
/* прогресс */
:root[data-game=min] .xpb{height:6px;border:0;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:none}
:root[data-game=min] .xpb .pb,:root[data-game=min] .pb{background:var(--accent)!important;border-radius:999px;box-shadow:none}
:root[data-game=min] .rwbar{height:6px;background:rgba(255,255,255,.06)}:root[data-game=min] .rwbar i{background:var(--accent)}

:root[data-game=min] #menub{background:transparent;border:0;color:var(--text);width:44px}
:root[data-game=min] .mebtn{border:0!important;width:36px;height:36px}

:root[data-game=min] .mi{border:0;border-radius:12px;font:500 15px var(--fb);color:var(--text);background:transparent;min-height:46px}
:root[data-game=min] .mi svg.i{color:var(--text-muted)}
:root[data-game=min] .mi.on{background:var(--card);color:var(--text)}
:root[data-game=min] .mi.on svg.i{color:var(--accent)}
:root[data-game=min] :is(.mg,.ds){font:500 13px var(--fb);color:var(--text-muted);text-transform:none;letter-spacing:0}
:root[data-game=min] .grid .mi,:root[data-game=min] .seg .mi{background:var(--card);border:1px solid var(--border)}
:root[data-game=min] .grid .mi.on,:root[data-game=min] .seg .mi.on{background:var(--card-hover);border-color:var(--accent)}
:root[data-game=min] .sw{border-color:rgba(255,255,255,.25)}

:root[data-game=min] .tabbar{background:color-mix(in srgb,var(--bg) 94%,transparent);border-top:1px solid var(--border)}
:root[data-game=min] .tab{font:500 11px var(--fb)!important;color:var(--text-muted)!important}
:root[data-game=min] .tab .tic{background:transparent!important;box-shadow:none!important}
:root[data-game=min] .tab.on{color:var(--accent)!important}
:root[data-game=min] .tab.on::after{content:'';position:absolute;left:50%;bottom:1px;width:18px;height:3px;margin-left:-9px;border-radius:3px;background:var(--accent)}

/* листы, тосты, награды */
:root[data-game=min] .sh{background:var(--bg);border-color:var(--border)}
:root[data-game=min] .toast{background:var(--card-hover);color:var(--text);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.35);font-weight:500}
:root[data-game=min] .rw{background:var(--card);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.4);-webkit-backdrop-filter:none;backdrop-filter:none}

:root[data-game=min] .rwi{background:var(--card-hover);border-radius:50%}

    s.docChanges().forEach(function(c){if(c.type==='removed'){delete box[c.doc.id];return;}var d=c.doc.data();box[c.doc.id]=d;
      if(c.type==='added'&&d.b===FB.uid&&tms(d.t)>LOADT&&!isMuted(d.a))notify((s16(d.an)||'…')+t('n_rps'),'','xo');});rpss=box;rRps();},function(){});});}
function rpsMe(g){return FB&&g.a===FB.uid?'a':'b';}
function rpsMy(g){return rpsMe(g)==='a'?g.ma:g.mb;}
function rpsTheir(g){return rpsMe(g)==='a'?g.mb:g.ma;}
function rpsOpp(g){return rpsMe(g)==='a'?{id:g.b,n:g.bn}:{id:g.a,n:g.an};}
function rpsRes(g){var a=rpsMy(g),b=rpsTheir(g);if(!a||!b)return '';if(a===b)return 'd';
  return ((a==='r'&&b==='s')||(a==='s'&&b==='p')||(a==='p'&&b==='r'))?'w':'l';}
function rpsStat(g){var r=rpsRes(g);if(r==='w')return t('xo_win');if(r==='l')return t('xo_lose');if(r==='d')return t('xo_draw');
  return rpsMy(g)?t('xo_their'):t('xo_my');}
function newRps(uid,nick){if(!FB||!uid||uid===FB.uid)return;
  FB.fs.collection('rps').add({a:FB.uid,b:uid,an:(prof.nick||'').slice(0,16),bn:s16(nick),ma:'',mb:'',t:TS()})
    .then(function(r){rpsCur=r.id;mgMode='rps';rMg();}).catch(function(){});}
function rpsMove(id,mv){var g=rpss[id];if(!g||rpsMy(g))return;var u={t:TS()};u[rpsMe(g)==='a'?'ma':'mb']=mv;
  FB.fs.collection('rps').doc(id).update(u).catch(function(){});quest('rps');}
function rRps(){
  var ids=Object.keys(rpss).sort(function(a,b){return tms(rpss[b].t)-tms(rpss[a].t);});
  if(rpsCur&&!rpss[rpsCur])rpsCur=null;
  if(!rpsCur)rpsCur=ids.filter(function(id){return !rpsMy(rpss[id]);})[0]||null;
  var bx=$('rpsb');bx.innerHTML='';
  if(!FB)bx.appendChild(el('div','muted',t('off_srv')));
  else if(!rpsCur)bx.appendChild(empty('👇',t('xo_pick')));
  else{var g=rpss[rpsCur],o=rpsOpp(g),my=rpsMy(g),th=rpsTheir(g);
    bx.appendChild(el('div','xst',t('xo_vs')+(s16(o.n)||'…')));
    if(!my){var grid=el('div','rpsb');['r','p','s'].forEach(function(k){var b=el('button',null,RPSI[k]);b.type='button';b.onclick=function(){rpsMove(rpsCur,k);};grid.appendChild(b);});
      bx.appendChild(grid);if(th)bx.appendChild(el('div','muted',t('rps_ready')+' ✓')).style.textAlign='center';}
    else if(!th){var v=el('div','rpsv');var y=el('div',null,RPSI[my]||'?');y.appendChild(el('small',null,t('rps_you')));v.appendChild(y);bx.appendChild(v);bx.appendChild(el('div','xst',t('rps_wait')));}
    else{var v2=el('div','rpsv');var y2=el('div',null,RPSI[my]||'?');y2.appendChild(el('small',null,t('rps_you')));
      var o2=el('div',null,RPSI[th]||'?');o2.appendChild(el('small',null,t('rps_them')));v2.appendChild(y2);v2.appendChild(el('span',null,'·'));v2.appendChild(o2);
      if(!RPSR[rpsCur]){RPSR[rpsCur]=1;v2.classList.add('reveal');}bx.appendChild(v2);bx.appendChild(el('div','xst',rpsStat(g)));}
    var row=el('div','row');row.style.marginTop='10px';
    if(my&&th){var a=el('button',null,t('xo_again'));a.type='button';a.style.flex='1';a.onclick=function(){newRps(o.id,o.n);};row.appendChild(a);}
    var d=el('button','g','×');d.type='button';d.onclick=function(){var id=rpsCur;rpsCur=null;FB.fs.collection('rps').doc(id).delete().catch(function(){});};row.appendChild(d);
    bx.appendChild(row);}
  var l=$('rpsl');l.innerHTML='';
  if(!ids.length)l.appendChild(empty('🎲',t('xo_none')));
  ids.slice(0,15).forEach(function(id){var g=rpss[id],o=rpsOpp(g),r=el('div','item click'+(id===rpsCur?' mine':''));
    var x=el('div','t');x.appendChild(el('b',null,t('xo_vs')+(s16(o.n)||'…')));x.appendChild(el('small',null,rpsStat(g)));r.appendChild(x);
    if(!rpsMy(g))r.appendChild(el('span','bdg','!'));
    r.onclick=function(){rpsCur=id;rRps();window.scrollTo(0,0);};l.appendChild(r);});
  countWins();if(FB)badge();}

function rCle(){var b=$('cle');b.innerHTML='';EMBIMG.map(function(_,k){return 100+k;}).concat(CLEMB.map(function(_,k){return k;})).forEach(function(i){var s=el('button','avb'+(clEmb===i?' on':''));s.setAttribute('aria-label',t('a11_emb')+' '+(b.children.length+1));s.type='button';s.appendChild(embNode(i,'pav sm'));s.onclick=function(){clEmb=i;rCle();};b.appendChild(s);});}
function startClans(){
  watchReq();
  lazy('clan',function(){FB.fs.collection('clans').orderBy('xp','desc').limit(15).onSnapshot(function(s){clTopX=[];s.forEach(function(d){var x=d.data();x.id=d.id;clTopX.push(x);});rClan();},function(){});
  FB.fs.collection('clans').orderBy('wxp','desc').limit(20).onSnapshot(function(s){var wk=weekId();clTopW=[];s.forEach(function(d){var x=d.data();x.id=d.id;if(x.wk===wk&&x.wxp>0)clTopW.push(x);});rClan();checkAch();},function(){});});
  if(INV)FB.fs.collection('clans').doc(INV).get().then(function(s){if(s.exists){invClan=s.data();invClan.id=INV;show('clan');rClan();}}).catch(function(){});
  FB.fs.collection('clans').orderBy('mn','desc').limit(12).onSnapshot(function(s){clTop=[];s.forEach(function(d){var x=d.data();x.id=d.id;clTop.push(x);});rClan();},function(){});

function setClan(c){prof.cl=c?c.id:'';prof.ct=c?String(c.tag||'').slice(0,4):'';sv('hub.prof',prof);pushProf();checkAch();watchClan();}
function watchClan(){
  if(clUnsub){clUnsub();clUnsub=null;}if(clMsgUnsub){clMsgUnsub();clMsgUnsub=null;}
  myClan=null;clMsgs=[];clMembers={};
  if(!FB||!prof.cl){rClan();return;}
  var id=prof.cl;
  clUnsub=FB.fs.collection('clans').doc(id).onSnapshot(function(s){var d=s.exists?s.data():null;
    if(!d||!Array.isArray(d.members)||d.members.indexOf(FB.uid)<0){if(prof.cl===id){if(d)toast(t('cm_kicked'));setClan(null);}return;}
    d.id=id;myClan=d;if(prof.ct!==d.tag){prof.ct=String(d.tag||'').slice(0,4);sv('hub.prof',prof);pushProf();}
    d.members.forEach(function(u){if(!clMembers[u])getProf(u).then(function(p){clMembers[u]=p||{};rClan();});});
    rClan();},function(){});
  clMsgUnsub=FB.fs.collection('clanmsg').where('clan','==',id).onSnapshot(function(s){clMsgs=[];s.forEach(function(x){var d=x.data();d._id=x.id;clMsgs.push(d);});
    clMsgs.sort(function(a,b){return tms(a.t)-tms(b.t);});clMsgs=clMsgs.slice(-60);rClanChat();},function(){});

function FVx(){return firebase.firestore.FieldValue;}
