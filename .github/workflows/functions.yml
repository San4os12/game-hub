# Выкладка серверной части (пуш-уведомления) в Firebase Cloud Functions.
# Нужен секрет репозитория FIREBASE_SA или GGKEY — JSON-ключ сервисного аккаунта Google Cloud.
# Пока секрета нет — шаг выкладки просто пропускается.
name: Deploy Cloud Functions
on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/functions.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка ключа
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SA || secrets.GGKEY }}
        run: |
          if [ -z "$SA" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Секрета FIREBASE_SA нет — выкладку пропускаю"; fi
      - name: Установка зависимостей
        if: steps.key.outputs.skip != '1'
        run: cd functions && npm install --no-audit --no-fund
      - name: Выкладка в Firebase
        if: steps.key.outputs.skip != '1'
        env:
          SA: ${{ secrets.FIREBASE_SA || secrets.GGKEY }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set -o pipefail
          # включить нужные сервисы Google Cloud (первый раз)
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet 2>&1 | tee -a "$RUNNER_TEMP/deploy.txt" || true
          gcloud services enable cloudbilling.googleapis.com pubsub.googleapis.com cloudscheduler.googleapis.com eventarc.googleapis.com run.googleapis.com --project game-hub-f93c4 --quiet 2>&1 | tee -a "$RUNNER_TEMP/deploy.txt" || true
          npx -y firebase-tools@13 deploy --only functions --project game-hub-f93c4 --force --non-interactive 2>&1 | tee -a "$RUNNER_TEMP/deploy.txt"
      - name: Сохранить лог ошибки (ветка ci-logs)
        if: failure() && steps.key.outputs.skip != '1'
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          grep -v -i -E 'private_key|BEGIN PRIVATE|token' "$RUNNER_TEMP/deploy.txt" | tail -n 150 > "$RUNNER_TEMP/logs/deploy.txt" || true
          cd "$RUNNER_TEMP/logs"
          git init -q && git checkout -q -b ci-logs
          git config user.email "actions@github.com" && git config user.name "GitHub Actions"
          git add deploy.txt && git commit -q -m "deploy log $GITHUB_RUN_ID"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
